# ── Gen-level (truth) selections for the MDS LLP cluster study ────
# Object-level masks are built from the same derived collection as the
# histograms they filter (events.llp / events.<sys>Cluster, attached in
# custom/columns.py).  Every mask here needs truth information; the
# reco-only ones stay in configs_mds/selections.yaml.
#
# Almost every mask exists once per muon subdetector, so it is written once
# under _repeat and expanded over the systems axis (see src/suep_plot/config.py).

_axes:
  systems:
    - {SYS: csc, SYSU: CSC}
    - {SYS: dt,  SYSU: DT}
    - {SYS: rpc, SYSU: RPC}
  # LLP hit counts only exist for the two systems that can seed a cluster.
  hit_systems:
    - {SYS: csc, SYSU: CSC}
    - {SYS: dt,  SYSU: DT}

_repeat:
  # LLP decay volume flags (geometry defined in custom/columns.py), LLP
  # reconstructed (>= 1 matched DBSCAN cluster), and the matched / unmatched /
  # isolated splits of the clusters themselves.
  - over: systems
    defs:
      llp_in_<SYS>:
        level: object
        expression: "events.llp.in<SYSU>"
      llp_reco_<SYS>:
        level: object
        expression: "events.llp.reco<SYSU>"
      # Cluster truth-matched to an LLP (>= 10 rechits sharing one llpIdx),
      # and its complement: the fake / pile-up-like clusters.
      <SYS>_cluster_matched:
        level: object
        expression: "events.<SYS>Cluster.matched"
      <SYS>_cluster_unmatched:
        level: object
        expression: "~events.<SYS>Cluster.matched"
      # Cluster isolation from prompt activity: dR from the cluster centroid to
      # the closest reconstructed muon / jet (custom/columns.py, step
      # 'cluster_isolation') must be at least 0.4.  In events with no muon / no
      # jet at all the field carries the sentinel NO_OBJECT_DR = 999, so those
      # maximally isolated clusters pass the same comparison with no special case.
      <SYS>_cluster_iso_muon:
        level: object
        expression: "events.<SYS>Cluster.drMuon >= 0.4"
      <SYS>_cluster_iso_jet:
        level: object
        expression: "events.<SYS>Cluster.drJet >= 0.4"
      # Event-level bookkeeping (cutflow.txt)
      has_<SYS>_cluster:
        expression: "ak.num(events.<SYS>Cluster) >= 1"
      has_matched_<SYS>:
        expression: "ak.any(events.<SYS>Cluster.matched, axis=1)"

  # LLP is "reconstructable": >= 10 of its truth rechits in the system.
  - over: hit_systems
    defs:
      llp_hits10_<SYS>:
        level: object
        expression: "events.llp.nHits<SYSU> >= 10"

# ── The whole muon system, not one subdetector ────────────────────
llp_in_ms:
  level: object
  expression: "events.llp.inCSC | events.llp.inDT | events.llp.inRPC"
llp_reco_any:
  level: object
  expression: "events.llp.reco"
has_llp_in_ms:
  expression: "ak.any(events.llp.inCSC | events.llp.inDT | events.llp.inRPC, axis=1)"
