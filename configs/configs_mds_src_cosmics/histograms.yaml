# ── Category 5/6: every Cosmics cluster ───────────────────────────
# Cosmics MDSnano is a rechit-only ntuple -- 136 branches, no Jet, Muon,
# FatJet, PuppiMET or HLT -- so of the four event regions only `all`
# is kept (the trigger requirements cannot be evaluated), its event variables
# are the two cluster counts, and the dR-to-prompt-object plots are left out
# of the cluster lists.  Everything else is the same fill as the other sets,
# which is what makes them overlayable.

regions:
  all:
    label: all events
    evt_vars: [csc_cluster_n, dt_cluster_n]
    objects:
      csc_src:
        cut: csc_cluster_src
        label: CSC clusters
        vars:
        - csc_cluster_size
        - csc_cluster_eta
        - csc_cluster_phi
        - csc_cluster_eta_spread
        - csc_cluster_phi_spread
        - csc_cluster_nstation
        - csc_cluster_time
        - csc_cluster_nlayer
        - csc_cluster_station_span
        - csc_cluster_first_chamber
        - csc_cluster_first_station
        - csc_cluster_avg_station
        - csc_cluster_max_station_frac
        - csc_cluster_layer_hits_mean
        - csc_cluster_layer_hits_rms
        - csc_cluster_layer_hits_relrms
        - csc_cluster_max_layer_frac
        - csc_cluster_nzlayer
        - csc_cluster_zlayer_hits_mean
        - csc_cluster_zlayer_hits_rms
        - csc_cluster_zlayer_hits_relrms
        - csc_cluster_max_zlayer_frac
        - csc_cluster_r_spread
        - csc_cluster_z_spread
        - csc_cluster_first_system
        - csc_cluster_n_rpc_hits
        - csc_cluster_n_rpc_hits_bx0
        - csc_cluster_oot_hit_frac
        - {selections: [csc_cluster_has_rpc], var: csc_cluster_rpc_bx}
        - {selections: [csc_cluster_has_rpc], var: csc_cluster_rpc_bx_median}
        - {selections: [csc_cluster_has_rpc], var: csc_cluster_rpc_bx_spread}
        - {name: csc_cluster_rpc_bx_vs_size, selections: [csc_cluster_has_rpc], x: csc_cluster_size, y: csc_cluster_rpc_bx}
        - csc_cluster_rpc_hit_frac
        - {selections: [csc_cluster_has_rpc], var: csc_cluster_rpc_out_of_time_frac}
        - {selections: [csc_cluster_has_rpc], var: csc_cluster_rpc_time_from_bx}
        - csc_cluster_time_spread
        - {name: csc_cluster_time_vs_spread, x: csc_cluster_time, y: csc_cluster_time_spread}
        - {name: csc_cluster_time_vs_rpc_bx_time, selections: [csc_cluster_has_rpc], x: csc_cluster_time, y: csc_cluster_rpc_time_from_bx}
      dt_src:
        cut: dt_cluster_src
        label: DT clusters
        vars:
        - dt_cluster_size
        - dt_cluster_eta
        - dt_cluster_phi
        - dt_cluster_eta_spread
        - dt_cluster_phi_spread
        - dt_cluster_nstation
        - dt_cluster_nlayer
        - dt_cluster_station_span
        - dt_cluster_first_chamber
        - dt_cluster_first_station
        - dt_cluster_avg_station
        - dt_cluster_max_station_frac
        - dt_cluster_layer_hits_mean
        - dt_cluster_layer_hits_rms
        - dt_cluster_layer_hits_relrms
        - dt_cluster_max_layer_frac
        - dt_cluster_r_spread
        - dt_cluster_z_spread
        - dt_cluster_first_system
        - dt_cluster_n_rpc_hits
        - dt_cluster_n_rpc_hits_bx0
        - {selections: [dt_cluster_has_rpc], var: dt_cluster_rpc_bx}
        - {selections: [dt_cluster_has_rpc], var: dt_cluster_rpc_bx_median}
        - {selections: [dt_cluster_has_rpc], var: dt_cluster_rpc_bx_spread}
        - {name: dt_cluster_rpc_bx_vs_size, selections: [dt_cluster_has_rpc], x: dt_cluster_size, y: dt_cluster_rpc_bx}
        - dt_cluster_rpc_hit_frac
        - {selections: [dt_cluster_has_rpc], var: dt_cluster_rpc_out_of_time_frac}
        - {selections: [dt_cluster_has_rpc], var: dt_cluster_rpc_time_from_bx}
