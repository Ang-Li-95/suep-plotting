# ── Category 5/5: every Cosmics cluster ───────────────────────────
# No dR requirement, as asked, and none is possible: with no Jet and no Muon
# collection the cluster_isolation step cannot run, so drJet / drMuon do not
# exist on a Cosmics cluster at all.  The whole sample *is* the category --
# non-collision muon-system activity -- so the population cut passes
# everything, written as a mask over the cluster collection so it stays
# object-level like the other four.
_extends: ../common_clustersrc

muon_sel_foriso: null
jet_sel_foriso: null
csc_cluster_iso_muon: null
csc_cluster_iso_jet: null
dt_cluster_iso_muon: null
dt_cluster_iso_jet: null

csc_cluster_src:
  level: object
  label: all clusters
  expression: "events.cscCluster.size >= 0"
dt_cluster_src:
  level: object
  label: all clusters
  expression: "events.dtCluster.size >= 0"
