# ── Category 5/6: every Cosmics cluster ───────────────────────────
# No dR requirement, as asked, and none is possible: with no Jet and no Muon
# collection the cluster_isolation step cannot run, so drJet / drMuon do not
# exist on a Cosmics cluster at all.  The whole sample *is* the category --
# non-collision muon-system activity -- so the population cut passes
# everything, written as a mask over the cluster collection so it stays
# object-level like the other four.

# The axes the _repeat blocks below loop over.
_axes:
  systems:
  - {SYS: csc, SYSU: CSC}
  - {SYS: dt, SYSU: DT}

# Each template is written once and filled in per axis entry.
_repeat:
- over: systems
  defs:
    # Event-level bookkeeping (cutflow.txt)
    has_<SYS>_cluster: ak.num(events.<SYS>Cluster) >= 1

    # RPC content of the cluster: whether it picked up any RPC rechit at all,
    # and whether its innermost hit came from something other than RPC.
    <SYS>_cluster_has_rpc: events.<SYS>Cluster.nRPCHits > 0
    <SYS>_cluster_first_not_rpc: events.<SYS>Cluster.firstSystem != 2
    <SYS>_cluster_src: {label: all clusters, expression: events.<SYS>Cluster.size >= 0}
