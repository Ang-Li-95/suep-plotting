# ── Selections ─────────────────────────────────────────────────────
# Each entry defines a boolean cut.  Histograms list the selections
# they require; all listed selections are AND-ed together.
#
# Expressions use coffea NanoEvents syntax (`events`, aliased `ev`, plus
# `ak`, `np`).
#
# Fields:
#   expression:  expression -> boolean array.
#   level:       "event" (default) or "object".
#   label:       human-readable label (for cutflow tables / legends).
#
# Event-level selections return a flat boolean (one per event).
# Object-level selections return a jagged boolean matching a per-object
# collection.  When applied to a per_object histogram they filter which
# objects are filled; when applied to an event-level histogram they are
# auto-converted via ak.any() ("require >=1 passing object").

# ── Event-level ──────────────────────────────────────────────────

baseline:
  label: "Baseline"
  expression: "ak.num(events.Jet) >= 1"

high_ht:
  label: "$H_T > 200$ GeV"
  expression: "ak.sum(events.Jet.pt, axis=1) > 200"

has_muon:
  label: "$N_{\\mu} \\geq 1$"
  expression: "ak.num(events.Muon) >= 1"

has_csc_cluster:
  label: "$N_{\\mathrm{CSC\\ cl}} \\geq 1$"
  expression: "ak.num(events.cscMDSHLTCluster) >= 1"

has_dt_cluster:
  label: "$N_{\\mathrm{DT\\ cl}} \\geq 1$"
  expression: "ak.num(events.dtMDSHLTCluster) >= 1"

met_gt50:
  label: "$p_T^{\\mathrm{miss}} > 50$ GeV"
  expression: "events.PuppiMET.pt > 50"

# ── Object-level ─────────────────────────────────────────────────
# These filter individual objects within a collection.

good_jets:
  label: "$p_T^{\\mathrm{jet}} > 30$, $|\\eta| < 2.4$"
  expression: "(events.Jet.pt > 30) & (abs(events.Jet.eta) < 2.4)"
  level: object

