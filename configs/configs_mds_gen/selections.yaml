# ── The gen-level LLP study: all 6 Gen3 signals ───────────────────
# Extends ../common_gen (the shared truth histograms, selections,
# clustering-efficiency and matched/unmatched cluster-shape plots) with
# the LLP shower-shape family: the dR between each LLP's truth-matched
# rechits and their centroid, and its dependence on the LLP kinematics.
_extends: ../common_gen

# ── Selections for the gen-level LLP / rechit study ───────────────
# Truth-only masks on events.llp and the rechit collections; no cluster
# (reco) selections, so columns.yaml here enables no DBSCAN steps.

# LLP decay volume flags (geometry defined in custom/columns.py)

# LLP is "reconstructable": >= 10 of its truth rechits in the system
llp_hits10_total:
  level: object
  expression: "events.llp.nHitsTotal >= 10"

# LLP with >= 2 truth rechits: the minimum for a rechit-rechit dR to exist
# (the per-LLP dR fields are NaN below it and drop out of the fill anyway)
llp_hits2_csc:
  level: object
  expression: "events.llp.nHitsCSC >= 2"
llp_hits2_dt:
  level: object
  expression: "events.llp.nHitsDT >= 2"
llp_hits2_rpc:
  level: object
  expression: "events.llp.nHitsRPC >= 2"
llp_hits2_total:
  level: object
  expression: "events.llp.nHitsTotal >= 2"

# Controls for the boost study: to expose the dR90-vs-betagamma trend the
# multiplicity (shower size) and |eta| (eta-phi metric) must be held fixed,
# else they swamp the collimation effect.  Low-N + endcap-plateau |eta| band.
llp_hits_lt25_csc:
  level: object
  expression: "events.llp.nHitsCSC < 25"
llp_abseta_plateau:
  level: object
  expression: "(abs(events.llp.eta) > 1.6) & (abs(events.llp.eta) < 2.2)"

# Rechit truth-matched to an LLP (always False on truth-less background)
csc_rechit_matched:
  level: object
  expression: "events.cscRechits.matchedLLP"
dt_rechit_matched:
  level: object
  expression: "events.dtRecHits.matchedLLP"
rpc_rechit_matched:
  level: object
  expression: "events.rpcRecHits.matchedLLP"
has_llp_hits_csc:
  expression: "ak.any(events.llp.nHitsCSC >= 10, axis=1)"
has_llp_hits_dt:
  expression: "ak.any(events.llp.nHitsDT >= 10, axis=1)"
