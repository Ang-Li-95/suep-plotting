# ── The gen-level LLP study: all 6 Gen3 signals ───────────────────
# Extends ../common_gen (the shared truth histograms, selections,
# clustering-efficiency and matched/unmatched cluster-shape plots) with
# the LLP shower-shape family: the dR between each LLP's truth-matched
# rechits and their centroid, and its dependence on the LLP kinematics.
_extends: ../common_gen

# ── Derived plots (computed at plot time, no reprocessing) ────────

# Does an LLP's rechit cone grow with the number of rechits it leaves?
llp_dr90_vs_nhits_csc_prof:
  type: profile_x
  source: llp_dr90_vs_nhits_csc
  label_x: '$N_{\mathrm{CSC\ rechits}}$ from LLP'
  label_y: 'Mean $\Delta R$ containing 90% of the rechits'

# 1D projections of the same 2D histogram
llp_nhits_csc_from_2d:
  type: projection_x
  source: llp_dr90_vs_nhits_csc
  label_x: '$N_{\mathrm{CSC\ rechits}}$ from LLP'

llp_dr90_csc_from_2d:
  type: projection_y
  source: llp_dr90_vs_nhits_csc
  label_x: 'LLP CSC rechits: $\Delta R$ containing 90%'

# eta dependence (profiles of the (4d) 2D maps): CSC is an endcap, so the
# hit count and the dR cone size both track |eta|.
llp_nhits_csc_vs_abseta_prof:
  type: profile_x
  source: llp_nhits_csc_vs_abseta
  label_x: 'LLP $|\eta|$'
  label_y: 'Mean $N_{\mathrm{CSC\ rechits}}$ from LLP'

llp_dr90_vs_abseta_prof:
  type: profile_x
  source: llp_dr90_vs_abseta
  label_x: 'LLP $|\eta|$'
  label_y: 'Mean $\Delta R$ containing 90% of the rechits'

# pT / energy profiles (of the (4e) 2D maps)
llp_nhits_csc_vs_pt_prof:
  type: profile_x
  source: llp_nhits_csc_vs_pt
  label_x: 'LLP $p_T$ [GeV]'
  label_y: 'Mean $N_{\mathrm{CSC\ rechits}}$ from LLP'

llp_dr90_vs_pt_prof:
  type: profile_x
  source: llp_dr90_vs_pt
  label_x: 'LLP $p_T$ [GeV]'
  label_y: 'Mean $\Delta R$ containing 90% of the rechits'

llp_nhits_csc_vs_energy_prof:
  type: profile_x
  source: llp_nhits_csc_vs_energy
  label_x: 'LLP energy [GeV]'
  label_y: 'Mean $N_{\mathrm{CSC\ rechits}}$ from LLP'

llp_dr90_vs_energy_prof:
  type: profile_x
  source: llp_dr90_vs_energy
  label_x: 'LLP energy [GeV]'
  label_y: 'Mean $\Delta R$ containing 90% of the rechits'

# boost / opening-angle profiles (of the (4f) 2D maps)
llp_opening_angle_vs_betagamma_prof:   # link (A): boost -> collimation
  type: profile_x
  source: llp_opening_angle_vs_betagamma
  label_x: 'LLP $\beta\gamma$'
  label_y: 'Mean decay opening angle [rad]'

llp_nhits_csc_vs_betagamma_prof:
  type: profile_x
  source: llp_nhits_csc_vs_betagamma
  label_x: 'LLP $\beta\gamma$'
  label_y: 'Mean $N_{\mathrm{CSC\ rechits}}$ from LLP'

llp_dr90_vs_betagamma_prof:            # confounded (|eta| + nHits): rises/flat
  type: profile_x
  source: llp_dr90_vs_betagamma
  label_x: 'LLP $\beta\gamma$'
  label_y: 'Mean $\Delta R$ containing 90% of the rechits'

llp_dr90_vs_betagamma_ctrl_prof:       # controlled: should DECREASE with boost
  type: profile_x
  source: llp_dr90_vs_betagamma_ctrl
  label_x: 'LLP $\beta\gamma$ ($1.6<|\eta|<2.2$, $N_{\mathrm{hits}}<25$)'
  label_y: 'Mean $\Delta R$ containing 90% of the rechits'

llp_dr90_vs_openangle_prof:            # link (B): dR90 vs opening angle
  type: profile_x
  source: llp_dr90_vs_openangle
  label_x: 'LLP decay opening angle [rad]'
  label_y: 'Mean $\Delta R$ containing 90% of the rechits'
