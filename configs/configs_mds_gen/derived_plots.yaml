# ── The gen-level LLP study: all 6 Gen3 signals ───────────────────
# Extends ../common_gen (the shared truth histograms, selections,
# clustering-efficiency and matched/unmatched cluster-shape plots) with
# the LLP shower-shape family: the dR between each LLP's truth-matched
# rechits and their centroid, and its dependence on the LLP kinematics.

_extends: ../common_gen

llp_dr90:
  type: profile_x
  region: llp
  cut: hits2_csc
  label_y: Mean $\Delta R$ containing 90% of the rechits
  vars: [llp_dr90_vs_abseta, llp_dr90_vs_betagamma, llp_dr90_vs_energy, llp_dr90_vs_nhits_csc, llp_dr90_vs_openangle, llp_dr90_vs_pt]
llp_dr90_vs_betagamma_ctrl_prof:
  type: profile_x
  region: llp
  cut: plateau_csc
  label_y: Mean $\Delta R$ containing 90% of the rechits
  vars: [llp_dr90_vs_betagamma_ctrl]
llp_nhits_csc_from_2d:
  type: projection_x
  region: llp
  cut: hits2_csc
  vars: [llp_dr90_vs_nhits_csc]
llp_nhits_csc:
  type: profile_x
  region: llp
  cut: hits2_csc
  label_y: Mean $N_{\mathrm{CSC\ rechits}}$ from LLP
  vars: [llp_nhits_csc_vs_abseta, llp_nhits_csc_vs_betagamma, llp_nhits_csc_vs_energy, llp_nhits_csc_vs_pt]
llp_opening_angle_vs_betagamma_prof:
  type: profile_x
  region: llp
  cut: all
  label_y: Mean decay opening angle [rad]
  vars: [llp_opening_angle_vs_betagamma]
llp_dr90_csc_from_2d:
  label_x: 'LLP CSC rechits: $\Delta R$ containing 90%'
  type: projection_y
  source: llp/hits2_csc/llp_dr90_vs_nhits_csc
