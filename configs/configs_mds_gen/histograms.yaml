# Hit-weighted view: every gen-matched rechit's dR to the centroid of the
# rechits of the same LLP in the same system (LLPs weighted by their hit
# multiplicity, unlike the per-LLP quantiles above).

csc_rechit_dr_llp:
  expression: "events.cscRechits.drLLP"
  per_object: true
  selections: [csc_rechit_matched]
  bins: 60
  lo: 0
  hi: 0.6
  label: 'matched CSC rechit $\Delta R$ to LLP centroid'
  log_y: true
  flow: sum

dt_rechit_dr_llp:
  expression: "events.dtRecHits.drLLP"
  per_object: true
  selections: [dt_rechit_matched]
  bins: 60
  lo: 0
  hi: 0.6
  label: 'matched DT rechit $\Delta R$ to LLP centroid'
  log_y: true
  flow: sum

rpc_rechit_dr_llp:
  expression: "events.rpcRecHits.drLLP"
  per_object: true
  selections: [rpc_rechit_matched]
  bins: 60
  lo: 0
  hi: 0.6
  label: 'matched RPC rechit $\Delta R$ to LLP centroid'
  log_y: true
  flow: sum

# Does the cone size grow with the number of rechits? (profile in
# derived_plots.yaml: llp_dr90_vs_nhits_csc_prof)
llp_dr90_vs_nhits_csc:
  expression_x: "events.llp.nHitsCSC"
  expression_y: "events.llp.dr90CSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins_x: 30
  lo_x: 0
  hi_x: 150
  bins_y: 60
  lo_y: 0
  hi_y: 0.6
  label_x: '$N_{\mathrm{CSC\ rechits}}$ from LLP'
  label_y: 'LLP CSC rechits: $\Delta R$ containing 90%'
  log_z: true

# ── (4d) eta dependence: CSC is an endcap, so both the hit count and the
# eta-phi dR metric depend on |eta| (dR at fixed physical size grows toward
# the beamline).  Same >= 2-hit population as llp_dr90_vs_nhits_csc, so the
# three 2D maps are directly comparable.
llp_nhits_csc_vs_abseta:
  expression_x: "abs(events.llp.eta)"
  expression_y: "events.llp.nHitsCSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins_x: 30
  lo_x: 0
  hi_x: 3
  bins_y: 40
  lo_y: 0
  hi_y: 120
  label_x: 'LLP $|\eta|$'
  label_y: '$N_{\mathrm{CSC\ rechits}}$ from LLP'
  log_z: true

llp_dr90_vs_abseta:
  expression_x: "abs(events.llp.eta)"
  expression_y: "events.llp.dr90CSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins_x: 30
  lo_x: 0
  hi_x: 3
  bins_y: 60
  lo_y: 0
  hi_y: 1.0
  label_x: 'LLP $|\eta|$'
  label_y: 'LLP CSC rechits: $\Delta R$ containing 90%'
  log_z: true

# ── (4e) pT / energy dependence: a more energetic LLP showers more (higher
# nHits) and, being more boosted, more collimated.  Same >= 2-hit population
# as the |eta| maps above.
llp_nhits_csc_vs_pt:
  expression_x: "events.llp.pt"
  expression_y: "events.llp.nHitsCSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins_x: 50
  lo_x: 0
  hi_x: 50
  bins_y: 40
  lo_y: 0
  hi_y: 120
  label_x: 'LLP $p_T$ [GeV]'
  label_y: '$N_{\mathrm{CSC\ rechits}}$ from LLP'
  log_z: true

llp_dr90_vs_pt:
  expression_x: "events.llp.pt"
  expression_y: "events.llp.dr90CSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins_x: 50
  lo_x: 0
  hi_x: 50
  bins_y: 60
  lo_y: 0
  hi_y: 1.0
  label_x: 'LLP $p_T$ [GeV]'
  label_y: 'LLP CSC rechits: $\Delta R$ containing 90%'
  log_z: true

llp_nhits_csc_vs_energy:
  expression_x: "events.llp.energy"
  expression_y: "events.llp.nHitsCSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins_x: 50
  lo_x: 0
  hi_x: 100
  bins_y: 40
  lo_y: 0
  hi_y: 120
  label_x: 'LLP energy [GeV]'
  label_y: '$N_{\mathrm{CSC\ rechits}}$ from LLP'
  log_z: true

llp_dr90_vs_energy:
  expression_x: "events.llp.energy"
  expression_y: "events.llp.dr90CSC"
