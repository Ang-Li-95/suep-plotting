  hi_y: 1.0
  label_x: 'LLP energy [GeV]'
  label_y: 'LLP CSC rechits: $\Delta R$ containing 90%'
  log_z: true

# ── (4f) Boost / decay-opening-angle: a more boosted (higher betagamma) LLP
# decays into a tighter daughter pair (openingAngle), which -- at low hit
# multiplicity, before showers merge -- shrinks the eta-phi rechit spread.
# openingAngle is the 3D angle between the two decay daughters (custom/columns.py).
llp_opening_angle:
  expression: "events.llp.openingAngle"
  per_object: true
  bins: 64
  lo: 0
  hi: 3.2
  label: 'LLP decay opening angle [rad]'
  log_y: true
  flow: sum

# link (A): boost sets the opening angle (expect a tight anti-correlation)
llp_opening_angle_vs_betagamma:
  expression_x: "events.llp.betagamma"
  expression_y: "events.llp.openingAngle"
  per_object: true
  bins_x: 40
  lo_x: 0
  hi_x: 40
  bins_y: 64
  lo_y: 0
  hi_y: 3.2
  label_x: 'LLP $\beta\gamma$'
  label_y: 'LLP decay opening angle [rad]'
  log_z: true

llp_nhits_csc_vs_betagamma:
  expression_x: "events.llp.betagamma"
  expression_y: "events.llp.nHitsCSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins_x: 40
  lo_x: 0
  hi_x: 40
  bins_y: 40
  lo_y: 0
  hi_y: 120
  label_x: 'LLP $\beta\gamma$'
  label_y: '$N_{\mathrm{CSC\ rechits}}$ from LLP'
  log_z: true

# dR90 vs boost, full population (confounded by |eta| and nHits -- the profile
# will look flat/rising, like the energy one)
llp_dr90_vs_betagamma:
  expression_x: "events.llp.betagamma"
  expression_y: "events.llp.dr90CSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins_x: 40
  lo_x: 0
  hi_x: 40
  bins_y: 60
  lo_y: 0
  hi_y: 1.0
  label_x: 'LLP $\beta\gamma$'
  label_y: 'LLP CSC rechits: $\Delta R$ containing 90%'
  log_z: true

# dR90 vs boost, CONTROLLED: fixed endcap |eta| band + low multiplicity, so the
# collimation effect is not swamped -- the profile should DECREASE with betagamma
llp_dr90_vs_betagamma_ctrl:
  expression_x: "events.llp.betagamma"
  expression_y: "events.llp.dr90CSC"
  per_object: true
  selections: [llp_hits2_csc, llp_hits_lt25_csc, llp_abseta_plateau]
  bins_x: 40
  lo_x: 0
  hi_x: 40
  bins_y: 60
  lo_y: 0
  hi_y: 1.0
  label_x: 'LLP $\beta\gamma$ ($1.6<|\eta|<2.2$, $N_{\mathrm{hits}}<25$)'
  label_y: 'LLP CSC rechits: $\Delta R$ containing 90%'
  log_z: true

# link (B): dR90 vs the opening angle directly
llp_dr90_vs_openangle:
  expression_x: "events.llp.openingAngle"
  expression_y: "events.llp.dr90CSC"
  per_object: true
