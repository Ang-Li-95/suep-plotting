# ── The gen-level LLP study: all 6 Gen3 signals ───────────────────
# Extends ../common_gen (the shared truth histograms, selections,
# clustering-efficiency and matched/unmatched cluster-shape plots) with
# the LLP shower-shape family: the dR between each LLP's truth-matched
# rechits and their centroid, and its dependence on the LLP kinematics.

_extends: ../common_gen

regions:
  csc_rechit:
    label: CSC rechits
    objects:
      matched:
        cut: csc_rechit_matched
        label: csc_rechit_matched
        vars: &csc_rechit_matched
          - csc_rechit_dr_llp
  dt_rechit:
    label: DT rechits
    objects:
      matched:
        cut: dt_rechit_matched
        label: dt_rechit_matched
        vars: &dt_rechit_matched
          - dt_rechit_dr_llp
  llp:
    objects:
      all:
        vars: &llp_all
          - {var: llp_pt, bins: [50, 0, 50], log_y: true}
          - llp_phi
          - {var: llp_energy, bins: [50, 0, 100], log_y: true}
          - {var: llp_decay_absz, bins: [60, 0, 2000], log_y: true}
          - llp_decay_eta
          - {name: llp_decay_rz, x: {var: llp_decay_absz, bins: [60, 0, 1500]}, y: {var: llp_decay_r, bins: [60, 0, 900]}}
          - llp_ctau
          - llp_llab
          - llp_betagamma
          - llp_nhits_csc
          - llp_nhits_dt
          - llp_nhits_rpc
          - llp_nhits_total
          - {var: llp_pt, name: llp_pt_all_den}
          - llp_eta
          - {var: llp_decay_r, log_y: true}
          - {var: llp_decay_absz, name: llp_absdecayz_all_den}
          - {name: llp_rz_all_den, x: llp_decay_absz, y: llp_decay_r}
          - {var: llp_energy, name: llp_energy_all_den}
          - llp_abseta
          - llp_opening_angle
          - {name: llp_opening_angle_vs_betagamma, x: {var: llp_betagamma, bins: [40, 0, 40]}, y: llp_opening_angle}
      hits2_csc:
        cut: llp_hits2_csc
        label: '>= 2 CSC hits'
        vars: &llp_hits2_csc
          - llp_drpair_min_csc
          - llp_drpair_max_csc
          - llp_dr50_csc
          - llp_dr80_csc
          - {var: llp_dr90_csc, bins: [60, 0, 0.6]}
          - llp_drmax_csc
          - {name: llp_dr90_vs_nhits_csc, x: {var: llp_nhits_csc, bins: [30, 0, 150], label: '$N_{\mathrm{CSC\ rechits}}$ from LLP'}, y: {var: llp_dr90_csc, bins: [60, 0, 0.6]}}
          - {name: llp_nhits_csc_vs_abseta, x: llp_abseta, y: {var: llp_nhits_csc, bins: [40, 0, 120], label: '$N_{\mathrm{CSC\ rechits}}$ from LLP'}}
          - {name: llp_dr90_vs_abseta, x: llp_abseta, y: llp_dr90_csc}
          - {name: llp_nhits_csc_vs_pt, x: {var: llp_pt, bins: [50, 0, 50]}, y: {var: llp_nhits_csc, bins: [40, 0, 120], label: '$N_{\mathrm{CSC\ rechits}}$ from LLP'}}
          - {name: llp_dr90_vs_pt, x: {var: llp_pt, bins: [50, 0, 50]}, y: llp_dr90_csc}
          - {name: llp_nhits_csc_vs_energy, x: {var: llp_energy, bins: [50, 0, 100]}, y: {var: llp_nhits_csc, bins: [40, 0, 120], label: '$N_{\mathrm{CSC\ rechits}}$ from LLP'}}
          - {name: llp_dr90_vs_energy, x: {var: llp_energy, bins: [50, 0, 100]}, y: llp_dr90_csc}
          - {name: llp_nhits_csc_vs_betagamma, x: {var: llp_betagamma, bins: [40, 0, 40]}, y: {var: llp_nhits_csc, bins: [40, 0, 120], label: '$N_{\mathrm{CSC\ rechits}}$ from LLP'}}
          - {name: llp_dr90_vs_betagamma, x: {var: llp_betagamma, bins: [40, 0, 40]}, y: llp_dr90_csc}
          - {name: llp_dr90_vs_openangle, x: {var: llp_opening_angle, bins: [50, 0, 2.5]}, y: llp_dr90_csc}
      hits2_dt:
        cut: llp_hits2_dt
        label: '>= 2 DT hits'
        vars: &llp_hits2_dt
          - llp_drpair_min_dt
          - llp_drpair_max_dt
          - llp_dr50_dt
          - llp_dr80_dt
          - llp_dr90_dt
          - llp_drmax_dt
      hits2_rpc:
        cut: llp_hits2_rpc
        label: '>= 2 RPC hits'
        vars: &llp_hits2_rpc
          - llp_drpair_min_rpc
          - llp_drpair_max_rpc
          - llp_dr50_rpc
          - llp_dr80_rpc
          - llp_dr90_rpc
          - llp_drmax_rpc
      hits2_total:
        cut: llp_hits2_total
        label: '>= 2 total hits'
        vars: &llp_hits2_total
          - llp_drpair_min_total
          - llp_drpair_max_total
          - llp_dr50_total
          - llp_dr80_total
          - llp_dr90_total
          - llp_drmax_total
      hits10_csc:
        cut: llp_hits10_csc
        label: '>= 10 CSC hits'
        vars: &llp_hits10_csc
          - llp_dr50_csc
          - llp_dr80_csc
          - {var: llp_dr90_csc, bins: [60, 0, 0.6]}
      hits10_dt:
        cut: llp_hits10_dt
        label: '>= 10 DT hits'
        vars: &llp_hits10_dt
          - llp_dr50_dt
          - llp_dr80_dt
          - llp_dr90_dt
      hits10_total:
        cut: llp_hits10_total
        label: '>= 10 total hits'
        vars: &llp_hits10_total
          - llp_dr50_total
          - llp_dr80_total
          - llp_dr90_total
      plateau_csc:
        cut: [llp_hits2_csc, llp_hits_lt25_csc, llp_abseta_plateau]
        label: '>= 2, < 25 CSC hits, |eta| plateau'
        vars: &llp_plateau_csc
          - {name: llp_dr90_vs_betagamma_ctrl, x: {var: llp_betagamma, bins: [40, 0, 40], label: 'LLP $\beta\gamma$ ($1.6<|\eta|<2.2$, $N_{\mathrm{hits}}<25$)'}, y: llp_dr90_csc}
  rpc_rechit:
    label: RPC rechits
    objects:
      matched:
        cut: rpc_rechit_matched
        label: rpc_rechit_matched
        vars: &rpc_rechit_matched
          - rpc_rechit_dr_llp
