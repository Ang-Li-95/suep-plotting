# ── Histogram definitions ──────────────────────────────────────────
# Each entry defines one histogram to fill during processing.
#
# Expressions use coffea NanoEvents object syntax and are evaluated with
# `events` (aliased `ev`), `ak` (awkward) and `np` (numpy) in scope, plus the
# builtins abs/len/min/max.  Examples:
#     events.Jet.pt              # per-jet pt (jagged)
#     ak.num(events.Jet)         # number of jets per event
#     ak.sum(events.Jet.pt, 1)   # scalar HT per event
#
# 1D fields:
#   expression:  expression -> array (flat or jagged).
#   bins / lo / hi:  axis binning.
#   label:       x-axis label (LaTeX ok).
#
# 2D fields (use instead of expression/bins/lo/hi):
#   expression_x / expression_y:  two expressions.
#   bins_x / lo_x / hi_x / bins_y / lo_y / hi_y:  per-axis binning.
#   label_x / label_y:  axis labels.
#
# Common fields:
#   selections:  list of selection names (selections.yaml).
#                Event-level selections are AND-ed as a per-event mask.
#                Object-level selections filter which objects are filled
#                (per_object histograms) or require >=1 passing object
#                (event-level histograms).
#   per_object:  fill per-object (jagged -> flat).  Default: false.
#   weight:      extra weight expression (x genWeight x corrections).
#
# Derived columns from custom/columns.py (which returns an augmented `events`)
# are available as new fields, e.g. events.my_new_field.
#
# Tip: to add a new histogram, just append an entry here and re-run.

# ── Event-level kinematics ─────────────────────────────────────────

jet_pt:
  expression: "events.Jet.pt"
  bins: 60
  lo: 0
  hi: 600
  label: "$p_{T}^{\\mathrm{jet}}$ [GeV]"
  per_object: true

jet_eta:
  expression: "events.Jet.eta"
  bins: 50
  lo: -5
  hi: 5
  label: "$\\eta^{\\mathrm{jet}}$"
  per_object: true

njet:
  expression: "ak.num(events.Jet)"
  bins: 20
  lo: 0
  hi: 20
  label: "$N_{\\mathrm{jets}}$"

met_pt:
  expression: "events.PuppiMET.pt"
  bins: 50
  lo: 0
  hi: 500
  label: "$p_{T}^{\\mathrm{miss}}$ [GeV]"

ht:
  expression: "ak.sum(events.Jet.pt, axis=1)"
  bins: 50
  lo: 0
  hi: 2000
  label: "$H_T$ [GeV]"

# ── With object-level selections ─────────────────────────────────
# Object selections filter which objects enter per_object histograms.
# For event-level histograms they require >= 1 passing object.

good_jet_pt:
  expression: "events.Jet.pt"
  bins: 60
  lo: 0
  hi: 600
  label: "$p_{T}^{\\mathrm{good\\ jet}}$ [GeV]"
  per_object: true
  selections: [good_jets]

good_jet_eta:
  expression: "events.Jet.eta"
  bins: 50
  lo: -5
  hi: 5
  label: "$\\eta^{\\mathrm{good\\ jet}}$"
  per_object: true
  selections: [good_jets]

met_with_good_jets:
  expression: "events.PuppiMET.pt"
  bins: 50
  lo: 0
  hi: 500
  label: "$p_{T}^{\\mathrm{miss}}$ [GeV] (good jets)"
  selections: [good_jets]

# ── Muon ───────────────────────────────────────────────────────────

muon_pt:
  expression: "events.Muon.pt"
  bins: 50
  lo: 0
  hi: 300
  label: "$p_{T}^{\\mu}$ [GeV]"
  per_object: true

muon_eta:
  expression: "events.Muon.eta"
  bins: 50
  lo: -2.5
  hi: 2.5
  label: "$\\eta^{\\mu}$"
  per_object: true

nmuon:
  expression: "ak.num(events.Muon)"
  bins: 10
  lo: 0
  hi: 10
  label: "$N_{\\mu}$"

# ── Electron ───────────────────────────────────────────────────────

electron_pt:
  expression: "events.Electron.pt"
  bins: 50
  lo: 0
  hi: 300
  label: "$p_{T}^{e}$ [GeV]"
  per_object: true

nelectron:
  expression: "ak.num(events.Electron)"
  bins: 10
  lo: 0
  hi: 10
  label: "$N_{e}$"

# ── MDS clusters ──────────────────────────────────────────────────

n_csc_clusters:
  expression: "ak.num(events.cscMDSHLTCluster)"
  bins: 10
  lo: 0
  hi: 10
  label: "$N_{\\mathrm{CSC\\ clusters}}$"

n_dt_clusters:
  expression: "ak.num(events.dtMDSHLTCluster)"
  bins: 10
  lo: 0
  hi: 10
  label: "$N_{\\mathrm{DT\\ clusters}}$"

csc_cluster_size:
  expression: "events.cscMDSHLTCluster.size"
  bins: 100
  lo: 0
  hi: 500
  label: "CSC cluster size"
  per_object: true

csc_cluster_eta:
  expression: "events.cscMDSHLTCluster.eta"
  bins: 50
  lo: -3
  hi: 3
  label: "$\\eta_{\\mathrm{CSC\\ cluster}}$"
  per_object: true

dt_cluster_size:
  expression: "events.dtMDSHLTCluster.size"
  bins: 100
  lo: 0
  hi: 500
  label: "DT cluster size"
  per_object: true

# ── PF candidates ────────────────────────────────────────────────

npfcand:
  expression: "ak.num(events.PFCand)"
  bins: 100
  lo: 0
  hi: 5000
  label: "$N_{\\mathrm{PF\\ cand}}$"

# ── SUEP gen particles ────────────────────────────────────────────

n_suep_genpart:
  expression: "ak.num(events.SUEPGenPart)"
  bins: 100
  lo: 0
  hi: 500
  label: "$N_{\\mathrm{SUEP\\ gen}}$"

suep_genpart_pt:
  expression: "events.SUEPGenPart.pt"
  bins: 60
  lo: 0
  hi: 30
  label: "$p_{T}^{\\mathrm{SUEP\\ gen}}$ [GeV]"
  per_object: true

# ── 2D histograms ───────────────────────────────────────────────
# Use expression_x / expression_y instead of expression.
# These produce colz-style 2D plots and can also be used as
# sources for profile / projection / efficiency derived plots
# (see configs/derived_plots.yaml).

jet_pt_vs_eta:
  expression_x: "events.Jet.eta"
  expression_y: "events.Jet.pt"
  bins_x: 50
  lo_x: -5
  hi_x: 5
  bins_y: 60
  lo_y: 0
  hi_y: 600
  label_x: "$\\eta^{\\mathrm{jet}}$"
  label_y: "$p_T^{\\mathrm{jet}}$ [GeV]"
  per_object: true

csc_cluster_size_vs_eta:
  expression_x: "events.cscMDSHLTCluster.eta"
  expression_y: "events.cscMDSHLTCluster.size"
  bins_x: 50
  lo_x: -3
  hi_x: 3
  bins_y: 50
  lo_y: 0
  hi_y: 500
  label_x: "$\\eta_{\\mathrm{CSC\\ cluster}}$"
  label_y: "CSC cluster size"
  per_object: true

# ── Generator-level ──────────────────────────────────────────────

genmet_pt:
  expression: "events.GenMET.pt"
  bins: 50
  lo: 0
  hi: 500
  label: "$p_{T}^{\\mathrm{gen\\ MET}}$ [GeV]"

pileup_npu:
  expression: "events.Pileup.nPU"
  bins: 80
  lo: 0
  hi: 80
  label: "$N_{\\mathrm{PU}}$"

