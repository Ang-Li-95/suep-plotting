# ── RPC content and RPC timing of the merged clusters ─────────────
# Filled from the RPC rechits belonging to a CSC cluster -- put there by
# DBSCAN (rpc_mode: merge) or associated to it afterwards (rpc_mode: match);
# custom/clustering.py.  The time fields are NaN on a cluster
# with no RPC hit, so every one of them is filtered by csc_cluster_has_rpc.
# NOTE the rechit time itself (rpcTime*) is unfilled in every MDSNano
# production so far -- rpcRecHits_Time is 0 with TimeError -1, so those fields
# are NaN and their histograms come out empty by construction.  The bunch
# crossing (rpcBx*) is the timing that is actually there.
csc_cluster_n_rpc_hits:
  expression: "events.cscCluster.nRPCHits"
  per_object: true
  bins: 50
  lo: 0
  hi: 100
  label: 'CSC cluster $N_{\mathrm{RPC\ hits}}$'
  log_y: true
  variants: csc_variants

csc_cluster_n_rpc_hits_bx0:
  expression: "events.cscCluster.nRPCHitsBx0"
  per_object: true
  bins: 50
  lo: 0
  hi: 100
  label: 'CSC cluster $N_{\mathrm{RPC\ hits}}$ at BX 0'
  log_y: true
  variants: csc_variants

csc_cluster_rpc_hit_frac:
  expression: "events.cscCluster.rpcHitFrac"
  per_object: true
  bins: 50
  lo: 0
  hi: 1
  label: 'CSC cluster RPC hit fraction'
  log_y: true
  variants: csc_variants

csc_cluster_first_system:
  expression: "events.cscCluster.firstSystem"
  per_object: true
  bins: 3
  lo: 0
  hi: 3
  label: 'CSC cluster innermost hit system (0 CSC, 1 DT, 2 RPC)'
  variants: csc_variants

csc_cluster_rpc_time:
  expression: "events.cscCluster.rpcTime"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 60
  lo: -30
  hi: 30
  label: 'CSC cluster RPC time [ns]'
  variants: csc_variants

csc_cluster_rpc_time_median:
  expression: "events.cscCluster.rpcTimeMedian"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 60
  lo: -30
  hi: 30
  label: 'CSC cluster RPC time (median) [ns]'
  variants: csc_variants

csc_cluster_rpc_time_weighted:
  expression: "events.cscCluster.rpcTimeWeighted"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 60
  lo: -30
  hi: 30
  label: 'CSC cluster RPC time ($1/\sigma^2$-weighted) [ns]'
  variants: csc_variants

csc_cluster_rpc_time_spread:
  expression: "events.cscCluster.rpcTimeSpread"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 50
  lo: 0
  hi: 25
  label: 'CSC cluster RPC time RMS [ns]'
  variants: csc_variants

csc_cluster_rpc_time_err:
  expression: "events.cscCluster.rpcTimeErr"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 50
  lo: 0
  hi: 5
  label: 'CSC cluster RPC time uncertainty [ns]'
  log_y: true
  variants: csc_variants

csc_cluster_rpc_bx:
  expression: "events.cscCluster.rpcBx"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 9
  lo: -4.5
  hi: 4.5
  label: 'CSC cluster mean RPC BX'
  log_y: true
  variants: csc_variants

csc_cluster_rpc_time_valid_frac:
  expression: "events.cscCluster.rpcTimeValidFrac"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 50
  lo: 0
  hi: 1
  label: 'CSC cluster fraction of RPC hits with a valid time'
  log_y: true
  variants: csc_variants

# The bunch crossing is the timing that IS filled in the current MDSNano
# productions (rpcRecHits_Time is 0 with TimeError -1 throughout), so this is
# the RPC time estimate to read today: 25 ns per BX.
csc_cluster_rpc_time_from_bx:
  expression: "events.cscCluster.rpcBx * 25"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 40
  lo: -100
  hi: 100
  label: 'CSC cluster RPC time from BX [ns]'
  variants: csc_variants

csc_cluster_rpc_bx_median:
  expression: "events.cscCluster.rpcBxMedian"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 9
  lo: -4.5
  hi: 4.5
  label: 'CSC cluster median RPC BX'
  log_y: true
  variants: csc_variants

csc_cluster_rpc_bx_spread:
  expression: "events.cscCluster.rpcBxSpread"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 40
  lo: 0
  hi: 4
  label: 'CSC cluster RPC BX RMS'
  log_y: true
  variants: csc_variants

csc_cluster_rpc_out_of_time_frac:
  expression: "events.cscCluster.rpcOutOfTimeFrac"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins: 50
  lo: 0
  hi: 1
  label: 'CSC cluster out-of-time RPC hit fraction'
  log_y: true
  variants: csc_variants

# Timing vs the cluster size and vs where it sits: a genuine displaced shower
# is both large and late, a prompt one large and in time.
csc_cluster_rpc_bx_vs_size:
  expression_x: "events.cscCluster.size"
  expression_y: "events.cscCluster.rpcBx"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins_x: 50
  lo_x: 0
  hi_x: 500
  bins_y: 9
  lo_y: -4.5
  hi_y: 4.5
  label_x: 'CSC cluster $N_{\mathrm{hits}}$'
  label_y: 'CSC cluster mean RPC BX'
  log_z: true

csc_cluster_rpc_time_vs_size:
  expression_x: "events.cscCluster.size"
  expression_y: "events.cscCluster.rpcTime"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins_x: 50
  lo_x: 0
  hi_x: 500
  bins_y: 60
  lo_y: -30
  hi_y: 30
  label_x: 'CSC cluster $N_{\mathrm{hits}}$'
  label_y: 'CSC cluster RPC time [ns]'
  log_z: true

csc_cluster_rpc_time_vs_nrpc:
  expression_x: "events.cscCluster.nRPCHits"
  expression_y: "events.cscCluster.rpcTime"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins_x: 50
  lo_x: 0
  hi_x: 100
  bins_y: 60
  lo_y: -30
  hi_y: 30
  label_x: 'CSC cluster $N_{\mathrm{RPC\ hits}}$'
  label_y: 'CSC cluster RPC time [ns]'
  log_z: true

