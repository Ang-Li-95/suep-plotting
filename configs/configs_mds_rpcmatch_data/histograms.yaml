# GENERATED by scripts/make_rpcmerge_configs.py from configs/configs_mds_data/ --
# edit that config set (or the generator) and re-run, do not edit this file.
#

# ── Reco-level histograms for the MDS cluster study ───────────────
# DBSCAN cluster properties from the derived collections in
# custom/columns.py (events.cscCluster / dtCluster; the RPC rechits belong to
# those two, see rpc_mode).
#
# Nothing here uses gen-level information, so every histogram fills
# identically on signal, on background samples without truth branches, and on
# ZeroBias data.
# Everything truth-dependent — the LLP collection, the truth-matched /
# unmatched cluster splits, the efficiency chain, the matched fractions and
# the signal-vs-background overlays — lives in configs_mds_grid/.

# ── Per-system cluster variant sets ───────────────────────────────
# Isolation splits applied to every cluster variable below, on top of the
# inclusive version.  Spelled identically to the iso_* entries of
# configs_mds_grid/histograms.yaml, so a data plot and its signal counterpart
# carry the same name and the same cut and can be overlaid directly.
#
# Nothing here needs truth, which is what keeps this config set runnable on
# ZeroBias data; the matched / unmatched splits stay in configs_mds_grid/.
_variant_sets:
  csc_variants:
    iso_muon:  {selections: [csc_cluster_iso_muon],  label_prefix: "muon-isolated "}
    iso_jet:   {selections: [csc_cluster_iso_jet],   label_prefix: "jet-isolated "}
    iso_both:
      selections: [csc_cluster_iso_muon, csc_cluster_iso_jet]
      label_prefix: "muon+jet-isolated "
  dt_variants:
    iso_muon:  {selections: [dt_cluster_iso_muon],   label_prefix: "muon-isolated "}
    iso_jet:   {selections: [dt_cluster_iso_jet],    label_prefix: "jet-isolated "}
    iso_both:
      selections: [dt_cluster_iso_muon, dt_cluster_iso_jet]
      label_prefix: "muon+jet-isolated "
# ── (3) DBSCAN cluster properties: CSC ─────────────────────────────
csc_cluster_n:
  expression: "ak.num(events.cscCluster)"
  bins: 6
  lo: 0
  hi: 6
  label: '$N_{\mathrm{CSC\ clusters}}$'
