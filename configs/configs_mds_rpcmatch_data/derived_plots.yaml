# configs_mds_rpcmatch_data/derived_plots.yaml -- rpc_mode: match.
#
# The DBSCAN is exactly the rpc_mode: separate one for CSC and DT, and the RPC
# rechits are associated to the finished clusters afterwards -- so they can date
# a cluster without being able to create one, and every cluster variable is
# bit-identical to the reference run.  The per-LLP hit denominators therefore
# stay the reference ones.
#
# Everything not named below is inherited from ../configs_mds_data, so the two
# studies stay comparable plot for plot by construction.  A 'name:' with no
# value deletes an inherited definition; see src/suep_plot/config.py.

_extends: ../configs_mds_data
prof_csc_rpc_bx_vs_size:
  type: profile_x
  source: csc_cluster_rpc_bx_vs_size
  label_x: CSC cluster $N_{\mathrm{hits}}$
  label_y: $\langle$RPC BX$\rangle$
prof_dt_rpc_bx_vs_size:
  type: profile_x
  source: dt_cluster_rpc_bx_vs_size
  label_x: DT cluster $N_{\mathrm{hits}}$
  label_y: $\langle$RPC BX$\rangle$
prof_csc_rpc_time_vs_size:
  type: profile_x
  source: csc_cluster_rpc_time_vs_size
  label_x: CSC cluster $N_{\mathrm{hits}}$
  label_y: $\langle$RPC time$\rangle$ [ns]
prof_dt_rpc_time_vs_size:
  type: profile_x
  source: dt_cluster_rpc_time_vs_size
  label_x: DT cluster $N_{\mathrm{hits}}$
  label_y: $\langle$RPC time$\rangle$ [ns]
