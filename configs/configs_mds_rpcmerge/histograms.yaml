# ── rpc_mode: merge ───────────────────────────────────────────────
# The RPC rechits are clustered *together with* the system they overlap --
# barrel RPC (Region == 0) with DT, endcap RPC with CSC -- instead of being
# associated to the finished clusters afterwards, which is the default
# (rpc_mode: match, ../configs_mds_signal -> ../common).
#
# Both modes produce the same two cluster collections carrying the same RPC
# fields, so this set compares with the default study plot for plot, with one physics
# difference: because the RPC hits are *inside* the cluster, they also count
# towards the per-LLP hit totals that define "reconstructable in this system".
# That is what the overrides below are.

_extends: ../configs_mds_signal

regions:
  llp:
    objects:
      all:
        vars: &llp_all
          - {var: llp_pt, bins: [50, 0, 50], log_y: true}
          - llp_phi
          - {var: llp_energy, bins: [50, 0, 100], log_y: true}
          - {var: llp_decay_absz, bins: [60, 0, 2000], log_y: true}
          - llp_decay_eta
          - {name: llp_decay_rz, x: {var: llp_decay_absz, bins: [60, 0, 1500]}, y: {var: llp_decay_r, bins: [60, 0, 900]}}
          - llp_ctau
          - llp_llab
          - llp_betagamma
          - llp_nhits_csc_rpc
          - llp_nhits_dt_rpc
          - llp_nhits_rpc
          - llp_nhits_total
          - {var: llp_pt, name: llp_pt_all_den}
          - llp_eta
          - {var: llp_decay_r, log_y: true}
          - {var: llp_decay_absz, name: llp_absdecayz_all_den}
          - {name: llp_rz_all_den, x: llp_decay_absz, y: llp_decay_r}
          - {var: llp_energy, name: llp_energy_all_den}
      in_csc:
        cut: llp_in_csc
        label: decay in CSC
        vars: &llp_in_csc
          - llp_pt
          - llp_nhits_csc_rpc
          - llp_eta
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_den_csc, x: llp_decay_absz, y: llp_decay_r}
          - llp_nrecocluster_csc
          - llp_energy
      in_dt:
        cut: llp_in_dt
        label: decay in DT
        vars: &llp_in_dt
          - llp_pt
          - llp_nhits_dt_rpc
          - llp_eta
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_den_dt, x: llp_decay_absz, y: llp_decay_r}
          - llp_nrecocluster_dt
          - llp_energy
      in_csc_reco:
        cut: [llp_in_csc, llp_reco_csc]
        label: decay in CSC, reconstructed
        vars: &llp_in_csc_reco
          - llp_pt
          - llp_nhits_csc_rpc
          - llp_eta
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_num_csc, x: llp_decay_absz, y: llp_decay_r}
          - llp_energy
      in_dt_reco:
        cut: [llp_in_dt, llp_reco_dt]
        label: decay in DT, reconstructed
        vars: &llp_in_dt_reco
          - llp_pt
          - llp_nhits_dt_rpc
          - llp_eta
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_num_dt, x: llp_decay_absz, y: llp_decay_r}
          - llp_energy
