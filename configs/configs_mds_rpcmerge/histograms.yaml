  log_y: true
  variants: csc_variants

# Timing vs the cluster size and vs where it sits: a genuine displaced shower
# is both large and late, a prompt one large and in time.
csc_cluster_rpc_bx_vs_size:
  expression_x: "events.cscCluster.size"
  expression_y: "events.cscCluster.rpcBx"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins_x: 50
  lo_x: 0
  hi_x: 500
  bins_y: 9
  lo_y: -4.5
  hi_y: 4.5
  label_x: 'CSC cluster $N_{\mathrm{hits}}$'
  label_y: 'CSC cluster mean RPC BX'
  log_z: true

csc_cluster_rpc_time_vs_size:
  expression_x: "events.cscCluster.size"
  expression_y: "events.cscCluster.rpcTime"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins_x: 50
  lo_x: 0
  hi_x: 500
  bins_y: 60
  lo_y: -30
  hi_y: 30
  label_x: 'CSC cluster $N_{\mathrm{hits}}$'
  label_y: 'CSC cluster RPC time [ns]'
  log_z: true

csc_cluster_rpc_time_vs_nrpc:
  expression_x: "events.cscCluster.nRPCHits"
  expression_y: "events.cscCluster.rpcTime"
  per_object: true
  selections: [csc_cluster_has_rpc]
  bins_x: 50
  lo_x: 0
  hi_x: 100
  bins_y: 60
  lo_y: -30
  hi_y: 30
  label_x: 'CSC cluster $N_{\mathrm{RPC\ hits}}$'
  label_y: 'CSC cluster RPC time [ns]'
  log_z: true

# ── RPC content and RPC timing of the merged clusters ─────────────
# Filled from the RPC rechits belonging to a DT cluster -- put there by
# DBSCAN (rpc_mode: merge) or associated to it afterwards (rpc_mode: match);
# custom/clustering.py.  The time fields are NaN on a cluster
# with no RPC hit, so every one of them is filtered by dt_cluster_has_rpc.
# NOTE the rechit time itself (rpcTime*) is unfilled in every MDSNano
# production so far -- rpcRecHits_Time is 0 with TimeError -1, so those fields
# are NaN and their histograms come out empty by construction.  The bunch
# crossing (rpcBx*) is the timing that is actually there.
dt_cluster_n_rpc_hits:
  expression: "events.dtCluster.nRPCHits"
  per_object: true
  bins: 50
  lo: 0
  hi: 100
  label: 'DT cluster $N_{\mathrm{RPC\ hits}}$'
  log_y: true
  variants: dt_variants

dt_cluster_n_rpc_hits_bx0:
  expression: "events.dtCluster.nRPCHitsBx0"
  per_object: true
  bins: 50
  lo: 0
  hi: 100
  label: 'DT cluster $N_{\mathrm{RPC\ hits}}$ at BX 0'
  log_y: true
  variants: dt_variants

dt_cluster_rpc_hit_frac:
  expression: "events.dtCluster.rpcHitFrac"
  per_object: true
  bins: 50
  lo: 0
  hi: 1
  label: 'DT cluster RPC hit fraction'
  log_y: true
  variants: dt_variants

dt_cluster_first_system:
  expression: "events.dtCluster.firstSystem"
  per_object: true
  bins: 3
  lo: 0
  hi: 3
  label: 'DT cluster innermost hit system (0 CSC, 1 DT, 2 RPC)'
  variants: dt_variants

dt_cluster_rpc_time:
  expression: "events.dtCluster.rpcTime"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 60
  lo: -30
  hi: 30
  label: 'DT cluster RPC time [ns]'
  variants: dt_variants

dt_cluster_rpc_time_median:
  expression: "events.dtCluster.rpcTimeMedian"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 60
  lo: -30
  hi: 30
  label: 'DT cluster RPC time (median) [ns]'
  variants: dt_variants

dt_cluster_rpc_time_weighted:
  expression: "events.dtCluster.rpcTimeWeighted"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 60
  lo: -30
  hi: 30
  label: 'DT cluster RPC time ($1/\sigma^2$-weighted) [ns]'
  variants: dt_variants

dt_cluster_rpc_time_spread:
  expression: "events.dtCluster.rpcTimeSpread"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 50
  lo: 0
  hi: 25
  label: 'DT cluster RPC time RMS [ns]'
  variants: dt_variants

dt_cluster_rpc_time_err:
  expression: "events.dtCluster.rpcTimeErr"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 50
  lo: 0
  hi: 5
  label: 'DT cluster RPC time uncertainty [ns]'
  log_y: true
  variants: dt_variants

dt_cluster_rpc_bx:
  expression: "events.dtCluster.rpcBx"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 9
  lo: -4.5
  hi: 4.5
  label: 'DT cluster mean RPC BX'
  log_y: true
  variants: dt_variants

dt_cluster_rpc_time_valid_frac:
  expression: "events.dtCluster.rpcTimeValidFrac"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 50
  lo: 0
  hi: 1
  label: 'DT cluster fraction of RPC hits with a valid time'
  log_y: true
  variants: dt_variants

# The bunch crossing is the timing that IS filled in the current MDSNano
# productions (rpcRecHits_Time is 0 with TimeError -1 throughout), so this is
# the RPC time estimate to read today: 25 ns per BX.
dt_cluster_rpc_time_from_bx:
  expression: "events.dtCluster.rpcBx * 25"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 40
  lo: -100
  hi: 100
  label: 'DT cluster RPC time from BX [ns]'
  variants: dt_variants

dt_cluster_rpc_bx_median:
  expression: "events.dtCluster.rpcBxMedian"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 9
  lo: -4.5
  hi: 4.5
  label: 'DT cluster median RPC BX'
  log_y: true
  variants: dt_variants

dt_cluster_rpc_bx_spread:
  expression: "events.dtCluster.rpcBxSpread"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 40
  lo: 0
  hi: 4
  label: 'DT cluster RPC BX RMS'
  log_y: true
  variants: dt_variants

dt_cluster_rpc_out_of_time_frac:
  expression: "events.dtCluster.rpcOutOfTimeFrac"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins: 50
  lo: 0
  hi: 1
  label: 'DT cluster out-of-time RPC hit fraction'
  log_y: true
  variants: dt_variants

# Timing vs the cluster size and vs where it sits: a genuine displaced shower
# is both large and late, a prompt one large and in time.
dt_cluster_rpc_bx_vs_size:
  expression_x: "events.dtCluster.size"
  expression_y: "events.dtCluster.rpcBx"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins_x: 50
  lo_x: 0
  hi_x: 500
  bins_y: 9
  lo_y: -4.5
  hi_y: 4.5
  label_x: 'DT cluster $N_{\mathrm{hits}}$'
  label_y: 'DT cluster mean RPC BX'
  log_z: true

dt_cluster_rpc_time_vs_size:
  expression_x: "events.dtCluster.size"
  expression_y: "events.dtCluster.rpcTime"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins_x: 50
  lo_x: 0
  hi_x: 500
  bins_y: 60
  lo_y: -30
  hi_y: 30
  label_x: 'DT cluster $N_{\mathrm{hits}}$'
  label_y: 'DT cluster RPC time [ns]'
  log_z: true

dt_cluster_rpc_time_vs_nrpc:
  expression_x: "events.dtCluster.nRPCHits"
  expression_y: "events.dtCluster.rpcTime"
  per_object: true
  selections: [dt_cluster_has_rpc]
  bins_x: 50
  lo_x: 0
  hi_x: 100
  bins_y: 60
  lo_y: -30
  hi_y: 30
  label_x: 'DT cluster $N_{\mathrm{RPC\ hits}}$'
  label_y: 'DT cluster RPC time [ns]'
  log_z: true

# ── CSC cluster timing: the out-of-time pile-up handles ───────────
# A genuine shower puts every hit at one time; a cluster DBSCAN assembled out
# of unrelated in-time and out-of-time hits is spread out.  csc_cluster_time
# (the mean) is above, with the reference study's binning.
csc_cluster_time_spread:
  expression: "events.cscCluster.timeSpread"
  per_object: true
  bins: 50
  lo: 0
  hi: 50
  label: 'CSC cluster $t_{\mathrm{peak}}$ RMS [ns]'
  log_y: true
  variants: csc_variants

csc_cluster_oot_hit_frac:
  expression: "events.cscCluster.ootHitFrac"
  per_object: true
  bins: 50
  lo: 0
  hi: 1
  label: 'CSC cluster out-of-time hit fraction ($|t_{\mathrm{peak}}| > 12.5$ ns)'
  log_y: true
  variants: csc_variants

# The plane the in-time selection is drawn in.
csc_cluster_time_vs_spread:
  expression_x: "events.cscCluster.time"
  expression_y: "events.cscCluster.timeSpread"
  per_object: true
  bins_x: 60
  lo_x: -30
  hi_x: 90
  bins_y: 50
  lo_y: 0
  hi_y: 50
  label_x: 'CSC cluster mean $t_{\mathrm{peak}}$ [ns]'
  label_y: 'CSC cluster $t_{\mathrm{peak}}$ RMS [ns]'
  log_z: true
