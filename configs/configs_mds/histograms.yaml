# ── (8) Cluster isolation from prompt muons / jets ────────────────
# events.<sys>Cluster.drMuon / .drJet: dR from the cluster centroid to the
# closest reconstructed Muon / Jet in the event (custom/columns.py).  Events
# with no muon (no jet) give NaN and drop out of the fill, so these are the
# distributions over clusters that *have* something to be measured against.
# Punch-through and muon-bremsstrahlung clusters pile up near 0; a displaced
# decay has no prompt object pointing at it and populates the tail.

csc_cluster_dr_muon:
  expression: "events.cscCluster.drMuon"
  per_object: true
  bins: 60
  lo: 0
  hi: 6
  label: 'CSC cluster $\Delta R$(closest muon)'
  log_y: true

csc_cluster_dr_jet:
  expression: "events.cscCluster.drJet"
  per_object: true
  bins: 60
  lo: 0
  hi: 6
  label: 'CSC cluster $\Delta R$(closest jet)'
  log_y: true

dt_cluster_dr_muon:
  expression: "events.dtCluster.drMuon"
  per_object: true
  bins: 60
  lo: 0
  hi: 6
  label: 'DT cluster $\Delta R$(closest muon)'
  log_y: true

dt_cluster_dr_jet:
  expression: "events.dtCluster.drJet"
  per_object: true
  bins: 60
  lo: 0
  hi: 6
  label: 'DT cluster $\Delta R$(closest jet)'
  log_y: true

rpc_cluster_dr_muon:
  expression: "events.rpcCluster.drMuon"
  per_object: true
  bins: 60
  lo: 0
  hi: 6
  label: 'RPC cluster $\Delta R$(closest muon)'
  log_y: true

rpc_cluster_dr_jet:
  expression: "events.rpcCluster.drJet"
  per_object: true
  bins: 60
  lo: 0
  hi: 6
  label: 'RPC cluster $\Delta R$(closest jet)'
  log_y: true

# 2D: dR to the closest muon vs to the closest jet, to see whether the two
# select the same clusters.
csc_cluster_dr_muon_vs_jet:
  expression_x: "events.cscCluster.drMuon"
  expression_y: "events.cscCluster.drJet"
  per_object: true
  bins_x: 60
  lo_x: 0
  hi_x: 6
  bins_y: 60
  lo_y: 0
  hi_y: 6
  label_x: 'CSC cluster $\Delta R$(closest muon)'
  label_y: 'CSC cluster $\Delta R$(closest jet)'
  log_z: true

dt_cluster_dr_muon_vs_jet:
  expression_x: "events.dtCluster.drMuon"
  expression_y: "events.dtCluster.drJet"
  per_object: true
  bins_x: 60
  lo_x: 0
  hi_x: 6
  bins_y: 60
  lo_y: 0
  hi_y: 6
  label_x: 'DT cluster $\Delta R$(closest muon)'
  label_y: 'DT cluster $\Delta R$(closest jet)'
  log_z: true
