# ── Reco-level selections for the MDS cluster study ───────────────
# Truth-based masks (LLP decay volume / reconstruction flags, truth-matched
# clusters) live in configs_mds_llp/selections.yaml.

# Event-level bookkeeping (cutflow.txt)
has_csc_cluster:
  expression: "ak.num(events.cscCluster) >= 1"
has_dt_cluster:
  expression: "ak.num(events.dtCluster) >= 1"
has_rpc_cluster:
  expression: "ak.num(events.rpcCluster) >= 1"
