# ── Reweighting definitions ────────────────────────────────────────
# Analysis-level reweighting (event- or object-level), multiplied into the
# event weight alongside genWeight and corrections.yaml scale factors.
# All entries are optional; an empty file means no reweighting.
#
# Two kinds, auto-detected:
#
#   expression:  any NanoEvents expression -> weight
#   binned map:  variable + edges + weights (1D), or
#                variable_x/variable_y + edges_x/edges_y + nested weights (2D);
#                file: loads the map fields from another YAML (e.g. generated
#                by suep-reweight), entry keys override.
#
# Common fields:
#   level:       event (default) or object.  Object-level expressions/maps
#                give one weight per object; the event weight is the product
#                over objects (empty events -> 1).
#   apply_to:    all (default) or a list of sample groups.  MC only.
#   samples:     explicit sample-name list (overrides apply_to; may include
#                data samples).
#   clamp:       binned maps: use the nearest bin outside the map range
#                (default: false -> weight 1 outside the range).
#   fill_only:   don't apply globally; only used where a histogram sets
#                weight: "@<name>".  Per-object maps referenced this way
#                weight each object individually in per_object histograms.
#
# Generate a map from two processed samples (e.g. reweight MC HT to data):
#   suep-reweight output/ --hist ht --num data_2024 --den qcd -o configs/ht_map.yaml
#
# ── Examples (uncomment to use) ────────────────────────────────────
#
# soft_met_weight:                      # event-level expression
#   expression: "1.0 / (1.0 + events.PuppiMET.pt / 200.0)"
#   apply_to: [background]
#
# jet_eta_flat:                         # object-level expression -> product
#   expression: "1.0 + 0.05 * abs(events.Jet.eta)"
#   level: object
#   apply_to: all
#
# ht_shape:                             # inline 1D binned map, event-level
#   variable: "ak.sum(events.Jet.pt, axis=1)"
#   edges: [0, 100, 200, 400, 800, 2000]
#   weights: [1.25, 1.10, 1.00, 0.90, 0.75]
#   clamp: true
#   apply_to: [background]
#
# ht_dataMC:                            # map generated by suep-reweight
#   file: ht_map.yaml
#   apply_to: [background]
#
# npu_vs_met:                           # 2D binned map, event-level
#   variable_x: "events.Pileup.nPU"
#   variable_y: "events.PuppiMET.pt"
#   edges_x: [0, 20, 40, 80]
#   edges_y: [0, 50, 100, 500]
#   weights:
#     - [1.1, 1.0, 0.9]
#     - [1.0, 1.0, 1.0]
#     - [0.9, 1.0, 1.1]
#   apply_to: all
#
# jet_pt_map:                           # per-object fill weighting:
#   file: jet_pt_map.yaml               #   histograms.yaml ->  weight: "@jet_pt_map"
#   fill_only: true                     # not applied globally
