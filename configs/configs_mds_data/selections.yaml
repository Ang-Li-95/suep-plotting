# ── Reco-level selections for the MDS cluster study (+ data) ──────
# Truth-based masks (LLP decay volume / reconstruction flags, truth-matched
# clusters) live in configs_mds_llp/selections.yaml.  Nothing here may depend
# on gen information: this config set also runs on ZeroBias data.

# The prompt-object cuts the cluster isolation is measured against;
# shared so the overlaid studies cannot drift apart.
_include: ../_common/prompt_objects.yaml

# Event-level bookkeeping (cutflow.txt)
has_csc_cluster:
  expression: "ak.num(events.cscCluster) >= 1"
has_dt_cluster:
  expression: "ak.num(events.dtCluster) >= 1"
has_rpc_cluster:
  expression: "ak.num(events.rpcCluster) >= 1"

# ── Cluster isolation from prompt activity ────────────────────────
# dR from the cluster centroid to the closest reconstructed muon / jet
# (custom/columns.py, step 'cluster_isolation') must be at least 0.4.
#
# In events with no muon / no jet at all the field carries the sentinel
# NO_OBJECT_DR = 999 (custom/columns.py), so those maximally isolated clusters
# pass on the same comparison and no special case is needed here.
csc_cluster_iso_muon:
  level: object
  expression: "events.cscCluster.drMuon >= 0.4"
dt_cluster_iso_muon:
  level: object
  expression: "events.dtCluster.drMuon >= 0.4"
rpc_cluster_iso_muon:
  level: object
  expression: "events.rpcCluster.drMuon >= 0.4"

csc_cluster_iso_jet:
  level: object
  expression: "events.cscCluster.drJet >= 0.4"
dt_cluster_iso_jet:
  level: object
  expression: "events.dtCluster.drJet >= 0.4"
rpc_cluster_iso_jet:
  level: object
  expression: "events.rpcCluster.drJet >= 0.4"
