# ── Reco-only cluster histograms, with the isolation splits ───────
# The fills come from ../common; this set adds the isolation splits (no
# truth here -- it also runs on ZeroBias data).

_extends: ../common

_variant_sets:
  csc_variants:
    iso_both:
      label_prefix: 'muon+jet-isolated '
      selections:
      - csc_cluster_iso_muon
      - csc_cluster_iso_jet
    iso_jet:
      label_prefix: 'jet-isolated '
      selections:
      - csc_cluster_iso_jet
    iso_muon:
      label_prefix: 'muon-isolated '
      selections:
      - csc_cluster_iso_muon
  dt_variants:
    iso_both:
      label_prefix: 'muon+jet-isolated '
      selections:
      - dt_cluster_iso_muon
      - dt_cluster_iso_jet
    iso_jet:
      label_prefix: 'jet-isolated '
      selections:
      - dt_cluster_iso_jet
    iso_muon:
      label_prefix: 'muon-isolated '
      selections:
      - dt_cluster_iso_muon
  rpc_variants:
    iso_both:
      label_prefix: 'muon+jet-isolated '
      selections:
      - rpc_cluster_iso_muon
      - rpc_cluster_iso_jet
    iso_jet:
      label_prefix: 'jet-isolated '
      selections:
      - rpc_cluster_iso_jet
    iso_muon:
      label_prefix: 'muon-isolated '
      selections:
      - rpc_cluster_iso_muon

# ── The inherited reco variables, split by the sets above ─────────
# Each line overrides one key of a histogram defined in ../common; the
# binning, expression and label come from there.  Add a cluster variable to
# ../common and give it a line here for it to be split too.

