# Two histograms: one straight from the clustering, one from the isolation --
# enough to prove the whole chain runs, selections.yaml reaches derive(), and
# the fills land.

regions:
  csc:
    label: CSC clusters
    objects:
      all:
        vars: &csc_all
          - {var: csc_cluster_size, log_y: null}
          - {var: csc_cluster_dr_muon, bins: [50, 0, 5], log_y: null}
