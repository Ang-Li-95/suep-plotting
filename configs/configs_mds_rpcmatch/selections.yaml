# GENERATED by scripts/make_rpcmerge_configs.py from configs/configs_mds_grid/ --
# edit that config set (or the generator) and re-run, do not edit this file.
#
# ── Gen-level (truth) selections for the MDS LLP cluster study ────
# Object-level masks are built from the same derived collection as the
# histograms they filter (events.llp / events.<sys>Cluster, attached in
# custom/columns.py).  Every mask here needs truth information; the
# reco-only ones stay in configs_mds/selections.yaml.

# LLP decay volume flags (geometry defined in custom/columns.py)
llp_in_csc:
  level: object
  expression: "events.llp.inCSC"
llp_in_dt:
  level: object
  expression: "events.llp.inDT"
llp_in_rpc:
  level: object
  expression: "events.llp.inRPC"
llp_in_ms:
  level: object
  expression: "events.llp.inCSC | events.llp.inDT | events.llp.inRPC"

# LLP successfully reconstructed (>= 1 matched DBSCAN cluster)
llp_reco_csc:
  level: object
  expression: "events.llp.recoCSC"
llp_reco_dt:
  level: object
  expression: "events.llp.recoDT"
llp_reco_any:
  level: object
  expression: "events.llp.reco"

# LLP is "reconstructable": >= 10 of its truth rechits in the system
llp_hits10_csc:
  level: object
  expression: "events.llp.nHitsCSC >= 10"
llp_hits10_dt:
  level: object
  expression: "events.llp.nHitsDT >= 10"

# Cluster truth-matched to an LLP (>= 10 rechits sharing one llpIdx)
csc_cluster_matched:
  level: object
  expression: "events.cscCluster.matched"
dt_cluster_matched:
  level: object
  expression: "events.dtCluster.matched"
# Event-level bookkeeping (cutflow.txt)
has_llp_in_ms:
  expression: "ak.any(events.llp.inCSC | events.llp.inDT | events.llp.inRPC, axis=1)"
has_csc_cluster:
  expression: "ak.num(events.cscCluster) >= 1"
has_dt_cluster:
  expression: "ak.num(events.dtCluster) >= 1"
has_matched_csc:
  expression: "ak.any(events.cscCluster.matched, axis=1)"
has_matched_dt:
  expression: "ak.any(events.dtCluster.matched, axis=1)"
# Cluster NOT truth-matched (fake / pile-up-like)
csc_cluster_unmatched:
  level: object
  expression: "~events.cscCluster.matched"
dt_cluster_unmatched:
  level: object
  expression: "~events.dtCluster.matched"
# ── Cluster isolation from prompt activity ────────────────────────
# dR from the cluster centroid to the closest reconstructed muon / jet
# (custom/columns.py, step 'cluster_isolation') must be at least 0.4.
#
# In events with no muon / no jet at all the field carries the sentinel
# NO_OBJECT_DR = 999 (custom/columns.py), so those maximally isolated clusters
# pass on the same comparison and no special case is needed here.
csc_cluster_iso_muon:
  level: object
  expression: "events.cscCluster.drMuon >= 0.4"
dt_cluster_iso_muon:
  level: object
  expression: "events.dtCluster.drMuon >= 0.4"
csc_cluster_iso_jet:
  level: object
  expression: "events.cscCluster.drJet >= 0.4"
dt_cluster_iso_jet:
  level: object
  expression: "events.dtCluster.drJet >= 0.4"

# ── RPC content of a merged cluster ───────────────────────────────
# The rpcTime* fields are NaN on a cluster that picked up no RPC rechit (a
# comparison against NaN is False, so those clusters would be dropped
# silently); this mask says so explicitly.
csc_cluster_has_rpc:
  level: object
  expression: "events.cscCluster.nRPCHits > 0"
dt_cluster_has_rpc:
  level: object
  expression: "events.dtCluster.nRPCHits > 0"

# The cluster's innermost hit is one of the primary system's, so its
# firstChamber / firstStation read on that system's scale (see
# SELECTION_INJECTIONS in the generator).  firstSystem codes: 0 CSC, 1 DT,
# 2 RPC.
csc_cluster_first_not_rpc:
  level: object
  expression: "events.cscCluster.firstSystem != 2"
dt_cluster_first_not_rpc:
  level: object
  expression: "events.dtCluster.firstSystem != 2"
