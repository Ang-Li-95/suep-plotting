# GENERATED by scripts/make_rpcmerge_configs.py from configs/configs_mds_grid/ --
# edit that config set (or the generator) and re-run, do not edit this file.
#
# custom/columns.py settings for this config set (see that module's docstring
# and the README's "Derived-column settings" section).
#
# Pinned to the same values as configs_mds/columns.yaml, not left to the module
# defaults: this set and configs_mds_data/ are overlaid against each other, so
# the clustering and the isolation-object definitions have to be identical by
# construction rather than by both happening to inherit today's defaults.
parameters:
  cluster_eps: 0.4
  cluster_min_samples: 10
  rpc_min_samples: 10
  # The CSC and DT clustering is exactly the reference one -- no RPC rechit
  # enters the DBSCAN -- and the RPC rechits are associated to the finished
  # clusters afterwards (nearest centroid within cluster_eps), purely to date
  # them (rpcTime*, rpcBx*).  The cluster variables are therefore identical to
  # configs_mds_grid's, which is the point: RPC noise cannot push a background
  # cluster over min_samples, and the signal region is unchanged.
  # rpc_min_samples is unused here.
  rpc_mode: match
  match_min_hits: 10
  llpidx_convention: genpart
  jerc: true                 # JEC on events.Jet first (data too); JER smearing on MC
  # Which prompt objects the cluster drMuon / drJet are measured against: one
  # entry per dR field, each a collection plus a per-object boolean expression.
  # `obj` is the collection; `jet_id` is the official jetid.json.gz decision
  # (2024 NanoAOD no longer stores Jet_jetId).  Add a field here -- electrons,
  # photons, HLT jets -- and it appears on every cluster with no code change.
  iso_objects:
    drMuon:
      collection: Muon
      expression: "(obj.pt > 10) & (abs(obj.eta) < 2.4) & obj.looseId"
    drJet:
      collection: Jet
      expression: "(obj.pt > 20) & (abs(obj.eta) < 2.4) & (obj.neHEF < 0.8) & (obj.chHEF > 0.1) & jet_id(obj, 'tightlepveto')"

# Everything: this is the truth superset of the study.
steps: [jerc, clusters, cluster_isolation, llp, llp_hits, llp_reco, llp_shape]
