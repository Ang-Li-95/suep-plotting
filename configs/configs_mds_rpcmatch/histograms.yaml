# configs_mds_rpcmatch/histograms.yaml -- rpc_mode: match.
#
# The DBSCAN is exactly the rpc_mode: separate one for CSC and DT, and the RPC
# rechits are associated to the finished clusters afterwards -- so they can date
# a cluster without being able to create one, and every cluster variable is
# bit-identical to the reference run.  The per-LLP hit denominators therefore
# stay the reference ones.
#
# Everything not named below is inherited from ../configs_mds_signal, so the two
# studies stay comparable plot for plot by construction.  A 'name:' with no
# value deletes an inherited definition; see src/suep_plot/config.py.

_extends: ../configs_mds_signal
_variant_sets:
  csc_iso:
    iso_muon: &id001
      selections:
      - csc_cluster_iso_muon
      label_prefix: 'muon-isolated '
    iso_jet: &id002
      selections:
      - csc_cluster_iso_jet
      label_prefix: 'jet-isolated '
    iso_both: &id003
      selections:
      - csc_cluster_iso_muon
      - csc_cluster_iso_jet
      label_prefix: 'muon+jet-isolated '
  dt_iso:
    iso_muon: &id004
      selections:
      - dt_cluster_iso_muon
      label_prefix: 'muon-isolated '
    iso_jet: &id005
      selections:
      - dt_cluster_iso_jet
      label_prefix: 'jet-isolated '
    iso_both: &id006
      selections:
      - dt_cluster_iso_muon
      - dt_cluster_iso_jet
      label_prefix: 'muon+jet-isolated '
  csc_variants:
    iso_muon: *id001
    iso_jet: *id002
    iso_both: *id003
    matched_iso_muon:
      selections:
      - csc_cluster_matched
      - csc_cluster_iso_muon
      label_prefix: 'matched muon-isolated '
    matched_iso_jet:
      selections:
      - csc_cluster_matched
      - csc_cluster_iso_jet
      label_prefix: 'matched jet-isolated '
    matched_iso_both:
      selections:
      - csc_cluster_matched
      - csc_cluster_iso_muon
      - csc_cluster_iso_jet
      label_prefix: 'matched muon+jet-isolated '
    matched:
      selections:
      - csc_cluster_matched
      label_prefix: 'matched '
    unmatched:
      selections:
      - csc_cluster_unmatched
      label_prefix: 'unmatched '
  dt_variants:
    iso_muon: *id004
    iso_jet: *id005
    iso_both: *id006
    matched_iso_muon:
      selections:
      - dt_cluster_matched
      - dt_cluster_iso_muon
      label_prefix: 'matched muon-isolated '
    matched_iso_jet:
      selections:
      - dt_cluster_matched
      - dt_cluster_iso_jet
      label_prefix: 'matched jet-isolated '
    matched_iso_both:
      selections:
      - dt_cluster_matched
      - dt_cluster_iso_muon
      - dt_cluster_iso_jet
      label_prefix: 'matched muon+jet-isolated '
    matched:
      selections:
      - dt_cluster_matched
      label_prefix: 'matched '
    unmatched:
      selections:
      - dt_cluster_unmatched
      label_prefix: 'unmatched '
csc_cluster_first_chamber:
  selections:
  - csc_cluster_first_not_rpc
csc_cluster_first_station:
  selections:
  - csc_cluster_first_not_rpc
dt_cluster_first_chamber:
  selections:
  - dt_cluster_first_not_rpc
dt_cluster_first_station:
  selections:
  - dt_cluster_first_not_rpc
csc_cluster_n_rpc_hits:
  expression: events.cscCluster.nRPCHits
  per_object: true
  bins: 50
  lo: 0
  hi: 100
  label: CSC cluster $N_{\mathrm{RPC\ hits}}$
  log_y: true
  variants: csc_variants
csc_cluster_n_rpc_hits_bx0:
  expression: events.cscCluster.nRPCHitsBx0
  per_object: true
  bins: 50
  lo: 0
  hi: 100
  label: CSC cluster $N_{\mathrm{RPC\ hits}}$ at BX 0
  log_y: true
  variants: csc_variants
csc_cluster_rpc_hit_frac:
