# GENERATED by scripts/make_rpcmerge_configs.py from configs/configs_mds_data/ --
# edit that config set (or the generator) and re-run, do not edit this file.
#
# custom/columns.py settings for this config set (see that module's docstring
# and the README's "Derived-column settings" section).
#
# The clustering and isolation numbers are pinned to exactly the values in
# configs_mds_grid/columns.yaml -- the two runs are overlaid, so a cluster here
# and a cluster there must have been built and isolated the same way.  Leaving
# either set on the module defaults would make that agreement accidental.
parameters:
  cluster_eps: 0.4
  cluster_min_samples: 10
  rpc_min_samples: 10
  # The RPC rechits are clustered with the system they overlap -- barrel RPC
  # (Region == 0) with DT, endcap RPC with CSC -- instead of on their own, so
  # this run has cscCluster and dtCluster only and each of them carries the RPC
  # timing of its own hits (rpcTime*).  rpc_min_samples is unused here: both
  # merged systems use cluster_min_samples.
  rpc_merge: true
  match_min_hits: 10         # sets cluster.matched, which the clusters step fills
  jerc: true                 # JEC on events.Jet first (data too); JER smearing on MC
  # Which prompt objects the cluster drMuon / drJet are measured against: one
  # entry per dR field, each a collection plus a per-object boolean expression.
  # `obj` is the collection; `jet_id` is the official jetid.json.gz decision
  # (2024 NanoAOD no longer stores Jet_jetId).  Add a field here -- electrons,
  # photons, HLT jets -- and it appears on every cluster with no code change.
  iso_objects:
    drMuon:
      collection: Muon
      expression: "(obj.pt > 10) & (abs(obj.eta) < 2.4) & obj.looseId"
    drJet:
      collection: Jet
      expression: "(obj.pt > 20) & (abs(obj.eta) < 2.4) & (obj.neHEF < 0.8) & (obj.chHEF > 0.1) & jet_id(obj, 'tightlepveto')"

# Reco-only: no histogram or selection here touches events.llp, so the four
# truth steps are dropped -- 4x faster derive() (23s -> 6s per 500 signal
# events) with bit-identical clusters, since cluster.matched / hasTruth are
# filled by the clusters step itself.  events.llp is deliberately absent, so a
# gen-dependent expression added here fails validation instead of filling empty.
# llpidx_convention is omitted for the same reason: only the llp step reads it.
steps: [jerc, clusters, cluster_isolation]
