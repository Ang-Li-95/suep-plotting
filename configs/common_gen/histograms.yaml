# ── (5) Efficiency histograms: vs LLP energy ───────────────────────
# The ten legs of every efficiency: the inclusive denominator, then per
# system the fiducial denominator, the ">= 10 truth rechits" intermediate
# step and the reconstructed numerator.
_axes:
  eff_legs:
    - {LEG: all_den,  LSEL: []}
    - {LEG: den_csc,  LSEL: [llp_in_csc]}
    - {LEG: hits_csc, LSEL: [llp_in_csc, llp_hits10_csc]}
    - {LEG: num_csc,  LSEL: [llp_in_csc, llp_reco_csc]}
    - {LEG: den_dt,   LSEL: [llp_in_dt]}
    - {LEG: hits_dt,  LSEL: [llp_in_dt, llp_hits10_dt]}
    - {LEG: num_dt,   LSEL: [llp_in_dt, llp_reco_dt]}
    - {LEG: den_rpc,  LSEL: [llp_in_rpc]}
    - {LEG: den_any,  LSEL: [llp_in_ms]}
    - {LEG: num_any,  LSEL: [llp_in_ms, llp_reco_any]}

_repeat:
  - over: eff_legs
    defs:
      llp_energy_<LEG>:
        expression: "events.llp.energy"
        per_object: true
        selections: <LSEL>
        edges: [0, 2, 4, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50, 70, 100]
        label: 'LLP energy [GeV]'

