  per_object: true
  selections: [llp_reco_csc]
  bins_x: 75
  lo_x: 0
  hi_x: 1500
  bins_y: 60
  lo_y: 0
  hi_y: 1200
  label_x: 'LLP decay $|z|$ [cm]'
  label_y: 'LLP decay $r$ [cm]'
  log_z: true
llp_rz_all_num_dt:
  expression_x: "abs(events.llp.decayZ)"
  expression_y: "events.llp.decayR"
  per_object: true
  selections: [llp_reco_dt]
  bins_x: 75
  lo_x: 0
  hi_x: 1500
  bins_y: 60
  lo_y: 0
  hi_y: 1200
  label_x: 'LLP decay $|z|$ [cm]'
  label_y: 'LLP decay $r$ [cm]'
  log_z: true

# ── (6) Matched-LLP properties ─────────────────────────────────────
llp_matched_pt:
  expression: "events.llp.pt"
  per_object: true
  selections: [llp_reco_any]
  bins: 50
  lo: 0
  hi: 50
  label: 'matched LLP $p_T$ [GeV]'

llp_matched_eta:
  expression: "events.llp.eta"
  per_object: true
  selections: [llp_reco_any]
  bins: 50
  lo: -5
  hi: 5
  label: 'matched LLP $\eta$'

llp_matched_phi:
  expression: "events.llp.phi"
  per_object: true
  selections: [llp_reco_any]
  bins: 32
  lo: -3.2
  hi: 3.2
  label: 'matched LLP $\phi$'

llp_matched_energy:
  expression: "events.llp.energy"
  per_object: true
  selections: [llp_reco_any]
  bins: 50
  lo: 0
  hi: 100
  label: 'matched LLP $E$ [GeV]'

llp_matched_decayr:
  expression: "events.llp.decayR"
  per_object: true
  selections: [llp_reco_any]
  bins: 40
  lo: 0
  hi: 800
  label: 'matched LLP decay $r$ [cm]'

llp_matched_decayz:
  expression: "events.llp.decayZ"
  per_object: true
  selections: [llp_reco_any]
  bins: 48
  lo: -1200
  hi: 1200
  label: 'matched LLP decay $z$ [cm]'

# ── (3b) Layer occupancy ──────────────────────────────────────────
# The matched / unmatched split comes from 'variants:' (see _variant_sets at
# the top), so each variable's pair shares its binning by construction and can
# be turned into a matched-fraction 'efficiency' in derived_plots.yaml.

csc_cluster_nmatchedllp:
  expression: "events.cscCluster.nMatchedLLP"
  per_object: true
  bins: 6
  lo: 0
  hi: 6
  label: 'CSC cluster $N_{\mathrm{LLP\ matched}}$'
  log_y: true
  variants: csc_iso

dt_cluster_nmatchedllp:
  expression: "events.dtCluster.nMatchedLLP"
  per_object: true
  bins: 6
  lo: 0
  hi: 6
  label: 'DT cluster $N_{\mathrm{LLP\ matched}}$'
  log_y: true
  variants: dt_iso

llp_nrecocluster_csc:
  expression: "events.llp.nRecoClusterCSC"
  per_object: true
  selections: [llp_in_csc]
  bins: 6
  lo: 0
  hi: 6
  label: '$N_{\mathrm{CSC\ clusters}}$ matched to LLP'
  log_y: true

llp_nrecocluster_dt:
  expression: "events.llp.nRecoClusterDT"
  per_object: true
  selections: [llp_in_dt]
  bins: 6
  lo: 0
  hi: 6
  label: '$N_{\mathrm{DT\ clusters}}$ matched to LLP'
  log_y: true

llp_clusterhitfrac_csc:
  expression: "events.llp.clusterHitFracCSC"
  per_object: true
  selections: [llp_reco_csc]
  bins: 22
  lo: 0
  hi: 1.1
  label: 'LLP matched-rechit fraction in best CSC cluster'
  log_y: true

llp_clusterhitfrac_dt:
  expression: "events.llp.clusterHitFracDT"
  per_object: true
  selections: [llp_reco_dt]
  bins: 22
  lo: 0
  hi: 1.1
  label: 'LLP matched-rechit fraction in best DT cluster'
  log_y: true

