# ── Gen-level (truth) histograms, shared by the truth studies ─────
# Extends ../common with everything that needs gen information: the LLP
# collection, the truth-matched / unmatched splits of the DBSCAN clusters,
# and the numerator/denominator pairs of the efficiency chain.  A study with
# no truth branches uses ../common on its own.

_extends: ../common

regions:
  csc:
    objects:
      all:
        vars: &csc_all
          - csc_cluster_size
          - csc_cluster_eta
          - csc_cluster_phi
          - csc_cluster_eta_spread
          - csc_cluster_phi_spread
          - csc_cluster_nstation
          - csc_cluster_time
          - csc_cluster_nlayer
          - csc_cluster_station_span
          - {var: csc_cluster_first_chamber, selections: [csc_cluster_first_not_rpc]}
          - {var: csc_cluster_first_station, selections: [csc_cluster_first_not_rpc]}
          - csc_cluster_avg_station
          - csc_cluster_max_station_frac
          - csc_cluster_layer_hits_mean
          - csc_cluster_layer_hits_rms
          - csc_cluster_layer_hits_relrms
          - csc_cluster_max_layer_frac
          - csc_cluster_nzlayer
          - csc_cluster_zlayer_hits_mean
          - csc_cluster_zlayer_hits_rms
          - csc_cluster_zlayer_hits_relrms
          - csc_cluster_max_zlayer_frac
          - csc_cluster_r_spread
          - csc_cluster_z_spread
          - csc_cluster_dr_muon
          - csc_cluster_dr_jet
          - csc_cluster_first_system
          - csc_cluster_n_rpc_hits
          - csc_cluster_n_rpc_hits_bx0
          - csc_cluster_oot_hit_frac
          - {var: csc_cluster_rpc_bx, selections: [csc_cluster_has_rpc]}
          - {var: csc_cluster_rpc_bx_median, selections: [csc_cluster_has_rpc]}
          - {var: csc_cluster_rpc_bx_spread, selections: [csc_cluster_has_rpc]}
          - {name: csc_cluster_rpc_bx_vs_size, x: csc_cluster_size, y: csc_cluster_rpc_bx, selections: [csc_cluster_has_rpc]}
          - csc_cluster_rpc_hit_frac
          - {var: csc_cluster_rpc_out_of_time_frac, selections: [csc_cluster_has_rpc]}
          - {var: csc_cluster_rpc_time_from_bx, selections: [csc_cluster_has_rpc]}
          - csc_cluster_time_spread
          - {name: csc_cluster_time_vs_spread, x: csc_cluster_time, y: csc_cluster_time_spread}
          - {name: csc_cluster_time_vs_rpc_bx_time, x: csc_cluster_time, y: csc_cluster_rpc_time_from_bx, selections: [csc_cluster_has_rpc]}
          - csc_cluster_nmatchedhits
          - csc_cluster_nmatchedllp
      iso_both:
        cut: [csc_cluster_iso_muon, csc_cluster_iso_jet]
        label: muon+jet-isolated
        vars: &csc_iso_both
          - csc_cluster_size
          - csc_cluster_eta
          - csc_cluster_phi
          - csc_cluster_eta_spread
          - csc_cluster_phi_spread
          - csc_cluster_nstation
          - csc_cluster_time
          - csc_cluster_nlayer
          - csc_cluster_station_span
          - {var: csc_cluster_first_chamber, selections: [csc_cluster_first_not_rpc]}
          - {var: csc_cluster_first_station, selections: [csc_cluster_first_not_rpc]}
          - csc_cluster_avg_station
          - csc_cluster_max_station_frac
          - csc_cluster_layer_hits_mean
          - csc_cluster_layer_hits_rms
          - csc_cluster_layer_hits_relrms
          - csc_cluster_max_layer_frac
          - csc_cluster_nzlayer
          - csc_cluster_zlayer_hits_mean
          - csc_cluster_zlayer_hits_rms
          - csc_cluster_zlayer_hits_relrms
          - csc_cluster_max_zlayer_frac
          - csc_cluster_r_spread
          - csc_cluster_z_spread
          - csc_cluster_dr_muon
          - csc_cluster_dr_jet
          - csc_cluster_first_system
          - csc_cluster_n_rpc_hits
          - csc_cluster_n_rpc_hits_bx0
          - csc_cluster_oot_hit_frac
          - {var: csc_cluster_rpc_bx, selections: [csc_cluster_has_rpc]}
          - {var: csc_cluster_rpc_bx_median, selections: [csc_cluster_has_rpc]}
          - {var: csc_cluster_rpc_bx_spread, selections: [csc_cluster_has_rpc]}
          - csc_cluster_rpc_hit_frac
          - {var: csc_cluster_rpc_out_of_time_frac, selections: [csc_cluster_has_rpc]}
          - {var: csc_cluster_rpc_time_from_bx, selections: [csc_cluster_has_rpc]}
          - csc_cluster_time_spread
          - {name: csc_cluster_time_vs_rpc_bx_time, x: csc_cluster_time, y: csc_cluster_rpc_time_from_bx, selections: [csc_cluster_has_rpc]}
          - csc_cluster_nmatchedhits
          - csc_cluster_nmatchedllp
      iso_jet:
        cut: csc_cluster_iso_jet
        label: jet-isolated
        vars: *csc_iso_both
      iso_muon:
        cut: csc_cluster_iso_muon
        label: muon-isolated
        vars: *csc_iso_both
      matched:
        cut: csc_cluster_matched
        label: LLP-matched
        vars: &csc_matched
          - csc_cluster_size
          - csc_cluster_eta
          - csc_cluster_phi
          - csc_cluster_eta_spread
          - csc_cluster_phi_spread
          - csc_cluster_nstation
          - csc_cluster_time
          - csc_cluster_nlayer
          - csc_cluster_station_span
          - {var: csc_cluster_first_chamber, selections: [csc_cluster_first_not_rpc]}
          - {var: csc_cluster_first_station, selections: [csc_cluster_first_not_rpc]}
          - csc_cluster_avg_station
          - csc_cluster_max_station_frac
          - csc_cluster_layer_hits_mean
          - csc_cluster_layer_hits_rms
          - csc_cluster_layer_hits_relrms
          - csc_cluster_max_layer_frac
          - csc_cluster_nzlayer
          - csc_cluster_zlayer_hits_mean
          - csc_cluster_zlayer_hits_rms
          - csc_cluster_zlayer_hits_relrms
          - csc_cluster_max_zlayer_frac
          - csc_cluster_r_spread
          - csc_cluster_z_spread
          - csc_cluster_dr_muon
          - csc_cluster_dr_jet
          - csc_cluster_first_system
          - csc_cluster_n_rpc_hits
          - csc_cluster_n_rpc_hits_bx0
          - csc_cluster_oot_hit_frac
          - {var: csc_cluster_rpc_bx, selections: [csc_cluster_has_rpc]}
          - {var: csc_cluster_rpc_bx_median, selections: [csc_cluster_has_rpc]}
          - {var: csc_cluster_rpc_bx_spread, selections: [csc_cluster_has_rpc]}
          - csc_cluster_rpc_hit_frac
          - {var: csc_cluster_rpc_out_of_time_frac, selections: [csc_cluster_has_rpc]}
          - {var: csc_cluster_rpc_time_from_bx, selections: [csc_cluster_has_rpc]}
          - csc_cluster_time_spread
          - {name: csc_cluster_time_vs_rpc_bx_time, x: csc_cluster_time, y: csc_cluster_rpc_time_from_bx, selections: [csc_cluster_has_rpc]}
      matched_iso_both:
        cut: [csc_cluster_matched, csc_cluster_iso_muon, csc_cluster_iso_jet]
        label: LLP-matched, muon+jet-isolated
        vars: *csc_matched
      matched_iso_jet:
        cut: [csc_cluster_matched, csc_cluster_iso_jet]
        label: LLP-matched, jet-isolated
        vars: *csc_matched
      matched_iso_muon:
        cut: [csc_cluster_matched, csc_cluster_iso_muon]
        label: LLP-matched, muon-isolated
        vars: *csc_matched
      unmatched:
        cut: csc_cluster_unmatched
        label: unmatched
        vars: *csc_matched
  dt:
    objects:
      all:
        vars: &dt_all
          - dt_cluster_size
          - dt_cluster_eta
          - dt_cluster_phi
          - dt_cluster_eta_spread
          - dt_cluster_phi_spread
          - dt_cluster_nstation
          - dt_cluster_nlayer
          - dt_cluster_station_span
          - {var: dt_cluster_first_chamber, selections: [dt_cluster_first_not_rpc]}
          - {var: dt_cluster_first_station, selections: [dt_cluster_first_not_rpc]}
          - dt_cluster_avg_station
          - dt_cluster_max_station_frac
          - dt_cluster_layer_hits_mean
          - dt_cluster_layer_hits_rms
          - dt_cluster_layer_hits_relrms
          - dt_cluster_max_layer_frac
          - dt_cluster_r_spread
          - dt_cluster_z_spread
          - dt_cluster_dr_muon
          - dt_cluster_dr_jet
          - dt_cluster_first_system
          - dt_cluster_n_rpc_hits
          - dt_cluster_n_rpc_hits_bx0
          - {var: dt_cluster_rpc_bx, selections: [dt_cluster_has_rpc]}
          - {var: dt_cluster_rpc_bx_median, selections: [dt_cluster_has_rpc]}
          - {var: dt_cluster_rpc_bx_spread, selections: [dt_cluster_has_rpc]}
          - {name: dt_cluster_rpc_bx_vs_size, x: dt_cluster_size, y: dt_cluster_rpc_bx, selections: [dt_cluster_has_rpc]}
          - dt_cluster_rpc_hit_frac
          - {var: dt_cluster_rpc_out_of_time_frac, selections: [dt_cluster_has_rpc]}
          - {var: dt_cluster_rpc_time_from_bx, selections: [dt_cluster_has_rpc]}
          - dt_cluster_nmatchedhits
          - dt_cluster_nmatchedllp
      iso_both:
        cut: [dt_cluster_iso_muon, dt_cluster_iso_jet]
        label: muon+jet-isolated
        vars: &dt_iso_both
          - dt_cluster_size
          - dt_cluster_eta
          - dt_cluster_phi
          - dt_cluster_eta_spread
          - dt_cluster_phi_spread
          - dt_cluster_nstation
          - dt_cluster_nlayer
          - dt_cluster_station_span
          - {var: dt_cluster_first_chamber, selections: [dt_cluster_first_not_rpc]}
          - {var: dt_cluster_first_station, selections: [dt_cluster_first_not_rpc]}
          - dt_cluster_avg_station
          - dt_cluster_max_station_frac
          - dt_cluster_layer_hits_mean
          - dt_cluster_layer_hits_rms
          - dt_cluster_layer_hits_relrms
          - dt_cluster_max_layer_frac
          - dt_cluster_r_spread
          - dt_cluster_z_spread
          - dt_cluster_dr_muon
          - dt_cluster_dr_jet
          - dt_cluster_first_system
          - dt_cluster_n_rpc_hits
          - dt_cluster_n_rpc_hits_bx0
          - {var: dt_cluster_rpc_bx, selections: [dt_cluster_has_rpc]}
          - {var: dt_cluster_rpc_bx_median, selections: [dt_cluster_has_rpc]}
          - {var: dt_cluster_rpc_bx_spread, selections: [dt_cluster_has_rpc]}
          - dt_cluster_rpc_hit_frac
          - {var: dt_cluster_rpc_out_of_time_frac, selections: [dt_cluster_has_rpc]}
          - {var: dt_cluster_rpc_time_from_bx, selections: [dt_cluster_has_rpc]}
          - dt_cluster_nmatchedhits
          - dt_cluster_nmatchedllp
      iso_jet:
        cut: dt_cluster_iso_jet
        label: jet-isolated
        vars: *dt_iso_both
      iso_muon:
        cut: dt_cluster_iso_muon
        label: muon-isolated
        vars: *dt_iso_both
      matched:
        cut: dt_cluster_matched
        label: LLP-matched
        vars: &dt_matched
          - dt_cluster_size
          - dt_cluster_eta
          - dt_cluster_phi
          - dt_cluster_eta_spread
          - dt_cluster_phi_spread
          - dt_cluster_nstation
          - dt_cluster_nlayer
          - dt_cluster_station_span
          - {var: dt_cluster_first_chamber, selections: [dt_cluster_first_not_rpc]}
          - {var: dt_cluster_first_station, selections: [dt_cluster_first_not_rpc]}
          - dt_cluster_avg_station
          - dt_cluster_max_station_frac
          - dt_cluster_layer_hits_mean
          - dt_cluster_layer_hits_rms
          - dt_cluster_layer_hits_relrms
          - dt_cluster_max_layer_frac
          - dt_cluster_r_spread
          - dt_cluster_z_spread
          - dt_cluster_dr_muon
          - dt_cluster_dr_jet
          - dt_cluster_first_system
          - dt_cluster_n_rpc_hits
          - dt_cluster_n_rpc_hits_bx0
          - {var: dt_cluster_rpc_bx, selections: [dt_cluster_has_rpc]}
          - {var: dt_cluster_rpc_bx_median, selections: [dt_cluster_has_rpc]}
          - {var: dt_cluster_rpc_bx_spread, selections: [dt_cluster_has_rpc]}
          - dt_cluster_rpc_hit_frac
          - {var: dt_cluster_rpc_out_of_time_frac, selections: [dt_cluster_has_rpc]}
          - {var: dt_cluster_rpc_time_from_bx, selections: [dt_cluster_has_rpc]}
      matched_iso_both:
        cut: [dt_cluster_matched, dt_cluster_iso_muon, dt_cluster_iso_jet]
        label: LLP-matched, muon+jet-isolated
        vars: *dt_matched
      matched_iso_jet:
        cut: [dt_cluster_matched, dt_cluster_iso_jet]
        label: LLP-matched, jet-isolated
        vars: *dt_matched
      matched_iso_muon:
        cut: [dt_cluster_matched, dt_cluster_iso_muon]
        label: LLP-matched, muon-isolated
        vars: *dt_matched
      unmatched:
        cut: dt_cluster_unmatched
        label: unmatched
        vars: *dt_matched
  llp:
    label: LLPs
    per_event:
      - llp_n
      - llp_n_tracker
      - llp_n_calo
      - llp_n_csc_dt
      - llp_n_csc
      - llp_n_dt
    objects:
      all:
        vars: &llp_all
          - {var: llp_pt, bins: [50, 0, 50], log_y: true}
          - llp_phi
          - {var: llp_energy, bins: [50, 0, 100], log_y: true}
          - {var: llp_decay_absz, bins: [60, 0, 2000], log_y: true}
          - llp_decay_eta
          - {name: llp_decay_rz, x: {var: llp_decay_absz, bins: [60, 0, 1500]}, y: {var: llp_decay_r, bins: [60, 0, 900]}}
          - llp_ctau
          - llp_llab
          - llp_betagamma
          - llp_nhits_csc
          - llp_nhits_dt
          - llp_nhits_rpc
          - llp_nhits_total
          - {var: llp_pt, name: llp_pt_all_den}
          - llp_eta
          - {var: llp_decay_r, log_y: true}
          - {var: llp_decay_absz, name: llp_absdecayz_all_den}
          - {name: llp_rz_all_den, x: llp_decay_absz, y: llp_decay_r}
          - {var: llp_energy, name: llp_energy_all_den}
      reco_csc:
        cut: llp_reco_csc
        label: reconstructed in CSC
        vars: &llp_reco_csc
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_all_num_csc, x: llp_decay_absz, y: llp_decay_r}
          - llp_clusterhitfrac_csc
      reco_dt:
        cut: llp_reco_dt
        label: reconstructed in DT
        vars: &llp_reco_dt
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_all_num_dt, x: llp_decay_absz, y: llp_decay_r}
          - llp_clusterhitfrac_dt
      in_csc:
        cut: llp_in_csc
        label: decay in CSC
        vars: &llp_in_csc
          - llp_pt
          - llp_nhits_csc
          - llp_eta
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_den_csc, x: llp_decay_absz, y: llp_decay_r}
          - llp_nrecocluster_csc
          - llp_energy
      in_dt:
        cut: llp_in_dt
        label: decay in DT
        vars: &llp_in_dt
          - llp_pt
          - llp_nhits_dt
          - llp_eta
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_den_dt, x: llp_decay_absz, y: llp_decay_r}
          - llp_nrecocluster_dt
          - llp_energy
      reco:
        cut: llp_reco_any
        label: reconstructed
        vars: &llp_reco
          - llp_decay_r
          - llp_decay_absz
          - {var: llp_pt, bins: [50, 0, 50]}
          - {var: llp_eta, bins: [50, -5, 5]}
          - llp_phi
          - {var: llp_energy, bins: [50, 0, 100]}
          - {var: llp_decay_r, bins: [40, 0, 800], name: llp_matched_decayr}
          - llp_decay_z
      in_csc_hits10:
        cut: [llp_in_csc, llp_hits10_csc]
        label: decay in CSC, >= 10 CSC hits
        vars: &llp_in_csc_hits10
          - llp_pt
          - llp_eta
          - llp_decay_absz
          - {name: llp_rz_hits_csc, x: llp_decay_absz, y: llp_decay_r}
          - llp_energy
      in_csc_reco:
        cut: [llp_in_csc, llp_reco_csc]
        label: decay in CSC, reconstructed
        vars: &llp_in_csc_reco
          - llp_pt
          - llp_nhits_csc
          - llp_eta
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_num_csc, x: llp_decay_absz, y: llp_decay_r}
          - llp_energy
      in_dt_reco:
        cut: [llp_in_dt, llp_reco_dt]
        label: decay in DT, reconstructed
        vars: &llp_in_dt_reco
          - llp_pt
          - llp_nhits_dt
          - llp_eta
          - llp_decay_r
          - llp_decay_absz
          - {name: llp_rz_num_dt, x: llp_decay_absz, y: llp_decay_r}
          - llp_energy
      in_dt_hits10:
        cut: [llp_in_dt, llp_hits10_dt]
        label: decay in DT, >= 10 DT hits
        vars: &llp_in_dt_hits10
          - llp_pt
          - llp_eta
          - llp_decay_r
          - {name: llp_rz_hits_dt, x: llp_decay_absz, y: llp_decay_r}
          - llp_energy
      in_ms:
        cut: llp_in_ms
        label: decay in the muon system
        vars: &llp_in_ms
          - llp_pt
          - llp_eta
          - llp_energy
      in_ms_reco:
        cut: [llp_in_ms, llp_reco_any]
        label: in the muon system, reconstructed
        vars: *llp_in_ms
