  bins: 50
  lo: 0
  hi: 200
  label: 'CSC cluster $N_{\mathrm{hits}}^{\mathrm{LLP-matched}}$'
  log_y: true
  variants: csc_iso

# ── (3) DBSCAN cluster properties: DT ──────────────────────────────
