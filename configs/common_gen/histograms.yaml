# ── Gen-level (truth) histograms, shared by the truth studies ─────
# Extends ../common with everything that needs gen information: the LLP
# collection, the truth-matched / unmatched splits of the DBSCAN clusters,
# and the numerator/denominator pairs of the efficiency chain.  A study with
# no truth branches uses ../common on its own.

_extends: ../common

# The 2D isolation-correlation plots are a data/background diagnostic; the
# truth study splits its clusters by gen matching instead.
csc_cluster_dr_muon_vs_jet: null
dt_cluster_dr_muon_vs_jet: null

llp_n:
  expression: "ak.num(events.llp)"
  bins: 60
  lo: 0
  hi: 60
  label: '$N_{\mathrm{LLP}}$'

# ── (1b) LLP kinematics ───────────────────────────────────────────
# Signed eta, so the two endcaps stay separable; the efficiency histograms
# below use the same convention.
llp_eta:
  expression: "events.llp.eta"
  per_object: true
  bins: 60
  lo: -3
  hi: 3
  label: 'LLP $\eta$'

llp_pt:
  expression: "events.llp.pt"
  per_object: true
  bins: 50
  lo: 0
  hi: 50
  label: 'LLP $p_T$ [GeV]'
  log_y: true

llp_phi:
  expression: "events.llp.phi"
  per_object: true
  bins: 32
  lo: -3.2
  hi: 3.2
  label: 'LLP $\phi$'

llp_energy:
  expression: "events.llp.energy"
  per_object: true
  bins: 50
  lo: 0
  hi: 100
  label: 'LLP energy [GeV]'
  log_y: true

# ── (2) LLPs decaying in each detector volume ──────────────────
llp_n_tracker:
  expression: "ak.sum(events.llp.inTracker, axis=1)"
  bins: 15
  lo: 0
  hi: 15
  label: '$N_{\mathrm{LLP}}$ decaying in the tracker'

llp_n_calo:
  expression: "ak.sum(events.llp.inCalo, axis=1)"
  bins: 15
  lo: 0
  hi: 15
  label: '$N_{\mathrm{LLP}}$ decaying in the calorimeters'

llp_n_csc_dt:
  expression: "ak.sum(events.llp.inCSC | events.llp.inDT, axis=1)"
  bins: 15
  lo: 0
  hi: 15
  label: '$N_{\mathrm{LLP}}$ decaying in CSC or DT'

llp_n_csc:
  expression: "ak.sum(events.llp.inCSC, axis=1)"
  bins: 15
  lo: 0
  hi: 15
  label: '$N_{\mathrm{LLP}}$ decaying in CSC'

llp_n_dt:
  expression: "ak.sum(events.llp.inDT, axis=1)"
  bins: 15
  lo: 0
  hi: 15
  label: '$N_{\mathrm{LLP}}$ decaying in DT'

llp_n_rpc:
  expression: "ak.sum(events.llp.inRPC, axis=1)"
  bins: 15
  lo: 0
  hi: 15
  label: '$N_{\mathrm{LLP}}$ decaying in RPC'

llp_decay_r:
  expression: "events.llp.decayR"
  per_object: true
  bins: 60
  lo: 0
  hi: 1200
  label: 'LLP decay $r$ [cm]'
  log_y: true

llp_decay_absz:
  expression: "abs(events.llp.decayZ)"
  per_object: true
  bins: 60
  lo: 0
  hi: 2000
  label: 'LLP decay $|z|$ [cm]'
  log_y: true

llp_decay_rz:
  expression_x: "abs(events.llp.decayZ)"
  expression_y: "events.llp.decayR"
  per_object: true
  bins_x: 60
  lo_x: 0
  hi_x: 1500
  bins_y: 60
  lo_y: 0
  hi_y: 900
  label_x: 'LLP decay $|z|$ [cm]'
  label_y: 'LLP decay $r$ [cm]'
  log_z: true

# ── (2b) LLP lifetime / boost ─────────────────────────────────────
# Proper decay length ctau = L_lab / (beta*gamma): exponential with mean
# = nominal sample lifetime (5 m = 500 cm here).
llp_ctau:
  expression: "events.llp.ctau"
  per_object: true
  bins: 60
  lo: 0
  hi: 3000
  label: 'LLP $c\tau$ (proper) [cm]'
  log_y: true

llp_llab:
  expression: "events.llp.Llab"
  per_object: true
  bins: 60
  lo: 0
  hi: 6000
  label: 'LLP lab decay length [cm]'
  log_y: true

llp_betagamma:
  expression: "events.llp.betagamma"
  per_object: true
  bins: 60
  lo: 0
  hi: 30
  label: 'LLP $\beta\gamma$'
  log_y: true

# ── (3) DBSCAN cluster properties: CSC ─────────────────────────────
csc_cluster_nmatchedhits:
  expression: "events.cscCluster.nMatchedHits"
