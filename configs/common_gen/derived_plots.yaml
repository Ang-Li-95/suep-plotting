# ── Derived plots for the truth studies ───────────────────────────
# Efficiencies: Clopper-Pearson intervals computed at plot time from the
# numerator/denominator histogram pairs in histograms.yaml here.
# NOTE: do not pass --lumi to suep-plot; xs*lumi scaling would distort the
# binomial intervals (xs is a placeholder anyway).

_extends: ../common

eff_any_vs_decayr_all:
  type: efficiency
  region: llp
  numerator: reco
  denominator: all
  label_y: MDS acc. $\times$ eff. (all LLPs)
  vars: [llp_decay_r]
eff_any:
  type: efficiency
  region: llp
  numerator: in_ms_reco
  denominator: in_ms
  label_y: MDS efficiency (decay in muon system)
  vars: [llp_energy, llp_eta, llp_pt]
eff_csc_fid_vs_eta:
  type: efficiency
  region: llp
  numerator: in_csc
  denominator: all
  label_y: 'Fiducial: decay in CSC / all LLPs'
  vars: [llp_eta]
eff_csc_hits_vs_absdecayz:
  type: efficiency
  region: llp
  numerator: in_csc_hits10
  denominator: in_csc
  label_y: 'Reconstructable: $\geq$10 CSC hits / fiducial'
  spans: [{hi: 623, label: ME1/1, lo: 582}, {hi: 719, label: 'ME1/2,3', lo: 678}, {hi: 847, label: ME2, lo: 810}, {hi: 954, label: ME3, lo: 917}, {hi: 1044, label: ME4, lo: 1006}]
