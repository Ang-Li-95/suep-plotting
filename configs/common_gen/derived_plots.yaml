# ── Derived plots for the truth studies ───────────────────────────
# Efficiencies: Clopper-Pearson intervals computed at plot time from the
# numerator/denominator histogram pairs in histograms.yaml here.
# NOTE: do not pass --lumi to suep-plot; xs*lumi scaling would distort the
# binomial intervals (xs is a placeholder anyway).

_extends: ../common

_axes:
  # Under the default rpc_mode: match there is no standalone RPC cluster, so
  # every family that used to cover RPC now covers only the system it shares
  # with, and `systems` is the CSC + DT pair.
  systems:
  - SYS: csc
    SYSU: CSC
  - SYS: dt
    SYSU: DT
  csc_rpc:
  - SYS: csc
    SYSU: CSC
  dt_rpc:
  - SYS: dt
    SYSU: DT
  csc_dt:
  - SYS: csc
    SYSU: CSC
  - SYS: dt
    SYSU: DT
_repeat:
- over: systems
  defs:
    eff_<SYS>_vs_pt:
      type: efficiency
      numerator: llp_pt_num_<SYS>
      denominator: llp_pt_den_<SYS>
      label_x: LLP $p_T$ [GeV]
      label_y: <SYSU> cluster efficiency (decay in <SYSU>)
    eff_<SYS>_vs_eta:
      type: efficiency
      numerator: llp_eta_num_<SYS>
      denominator: llp_eta_den_<SYS>
      label_x: LLP $\eta$
      label_y: <SYSU> cluster efficiency (decay in <SYSU>)
    matchfrac_<SYS>_size:
      type: efficiency
      numerator: <SYS>_cluster_size_matched
      denominator: <SYS>_cluster_size
      label_x: <SYSU> cluster $N_{\mathrm{hits}}$
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_eta:
      type: efficiency
      numerator: <SYS>_cluster_eta_matched
      denominator: <SYS>_cluster_eta
      label_x: <SYSU> cluster $\eta$
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_phi:
      type: efficiency
      numerator: <SYS>_cluster_phi_matched
      denominator: <SYS>_cluster_phi
      label_x: <SYSU> cluster $\phi$
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_eta_spread:
      type: efficiency
      numerator: <SYS>_cluster_eta_spread_matched
      denominator: <SYS>_cluster_eta_spread
      label_x: <SYSU> cluster $\eta$ spread
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_phi_spread:
      type: efficiency
      numerator: <SYS>_cluster_phi_spread_matched
      denominator: <SYS>_cluster_phi_spread
      label_x: <SYSU> cluster $\phi$ spread
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_nstation:
      type: efficiency
      numerator: <SYS>_cluster_nstation_matched
      denominator: <SYS>_cluster_nstation
      label_x: <SYSU> cluster $N_{\mathrm{stations}}$
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_nlayer:
      type: efficiency
      numerator: <SYS>_cluster_nlayer_matched
      denominator: <SYS>_cluster_nlayer
      label_x: <SYSU> cluster $N_{\mathrm{layers}}$
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_station_span:
      type: efficiency
      numerator: <SYS>_cluster_station_span_matched
      denominator: <SYS>_cluster_station_span
      label_x: <SYSU> cluster station span (max-min)
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_max_station_frac:
      type: efficiency
      numerator: <SYS>_cluster_max_station_frac_matched
      denominator: <SYS>_cluster_max_station_frac
      label_x: <SYSU> cluster max station hit fraction
      label_y: fraction of <SYSU> clusters LLP-matched
    sigbkg_<SYS>_cluster_eta:
      type: sig_vs_bkg
      signal: <SYS>_cluster_eta_matched
      background: <SYS>_cluster_eta
      label_x: <SYSU> cluster $\eta$
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_eta_spread:
      type: sig_vs_bkg
      signal: <SYS>_cluster_eta_spread_matched
      background: <SYS>_cluster_eta_spread
      label_x: <SYSU> cluster $\eta$ spread
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_max_station_frac:
      type: sig_vs_bkg
      signal: <SYS>_cluster_max_station_frac_matched
      background: <SYS>_cluster_max_station_frac
      label_x: <SYSU> cluster max station hit fraction
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_nlayer:
      type: sig_vs_bkg
      signal: <SYS>_cluster_nlayer_matched
      background: <SYS>_cluster_nlayer
      label_x: <SYSU> cluster $N_{\mathrm{layers}}$
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_nstation:
      type: sig_vs_bkg
      signal: <SYS>_cluster_nstation_matched
      background: <SYS>_cluster_nstation
      label_x: <SYSU> cluster $N_{\mathrm{stations}}$
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_phi:
      type: sig_vs_bkg
      signal: <SYS>_cluster_phi_matched
      background: <SYS>_cluster_phi
      label_x: <SYSU> cluster $\phi$
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_phi_spread:
      type: sig_vs_bkg
      signal: <SYS>_cluster_phi_spread_matched
      background: <SYS>_cluster_phi_spread
      label_x: <SYSU> cluster $\phi$ spread
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_size:
      type: sig_vs_bkg
      signal: <SYS>_cluster_size_matched
      background: <SYS>_cluster_size
      label_x: <SYSU> cluster $N_{\mathrm{hits}}$
      label_y: normalized clusters
      log_y: true
    sigbkg_<SYS>_cluster_station_span:
      type: sig_vs_bkg
      signal: <SYS>_cluster_station_span_matched
      background: <SYS>_cluster_station_span
      label_x: <SYSU> cluster station span (max-min)
      label_y: normalized clusters
    matchfrac_<SYS>_dr_muon:
      type: efficiency
      numerator: <SYS>_cluster_dr_muon_matched
      denominator: <SYS>_cluster_dr_muon
      label_x: <SYSU> cluster $\Delta R$(closest muon)
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_dr_jet:
      type: efficiency
      numerator: <SYS>_cluster_dr_jet_matched
      denominator: <SYS>_cluster_dr_jet
      label_x: <SYSU> cluster $\Delta R$(closest jet)
      label_y: fraction of <SYSU> clusters LLP-matched
    sigbkg_<SYS>_cluster_dr_muon:
      type: sig_vs_bkg
      signal: <SYS>_cluster_dr_muon_matched
      background: <SYS>_cluster_dr_muon
      label_x: <SYSU> cluster $\Delta R$(closest muon)
      label_y: normalized clusters
      log_y: true
    sigbkg_<SYS>_cluster_dr_jet:
      type: sig_vs_bkg
      signal: <SYS>_cluster_dr_jet_matched
      background: <SYS>_cluster_dr_jet
      label_x: <SYSU> cluster $\Delta R$(closest jet)
      label_y: normalized clusters
      log_y: true
- over: csc_rpc
  defs:
    eff_<SYS>_vs_decayr:
      type: efficiency
      numerator: llp_decayr_num_<SYS>
      denominator: llp_decayr_den_<SYS>
      label_x: LLP decay $r$ [cm]
      label_y: <SYSU> cluster efficiency (decay in <SYSU>)
    eff_<SYS>_vs_decayr_all:
      type: efficiency
      numerator: llp_decayr_all_num_<SYS>
      denominator: llp_decayr_all_den
      label_x: LLP decay $r$ [cm]
      label_y: <SYSU> acc. $\times$ eff. (all LLPs)
    matchfrac_<SYS>_time:
      type: efficiency
      numerator: <SYS>_cluster_time_matched
      denominator: <SYS>_cluster_time
      label_x: <SYSU> cluster mean $t_{\mathrm{peak}}$ [ns]
      label_y: fraction of <SYSU> clusters LLP-matched
- over: dt_rpc
  defs:
    eff_<SYS>_vs_absdecayz:
      type: efficiency
      numerator: llp_absdecayz_num_<SYS>
      denominator: llp_absdecayz_den_<SYS>
      label_x: LLP decay $|z|$ [cm]
      label_y: <SYSU> cluster efficiency (decay in <SYSU>)
    eff_<SYS>_vs_absdecayz_all:
      type: efficiency
      numerator: llp_absdecayz_all_num_<SYS>
      denominator: llp_absdecayz_all_den
      label_x: LLP decay $|z|$ [cm]
      label_y: <SYSU> acc. $\times$ eff. (all LLPs)
    matchfrac_<SYS>_layer_hits_relrms:
      type: efficiency
      numerator: <SYS>_cluster_layer_hits_relrms_matched
      denominator: <SYS>_cluster_layer_hits_relrms
      label_x: <SYSU> cluster RMS/mean of $N_{\mathrm{hits}}/\mathrm{layer}$
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_max_layer_frac:
      type: efficiency
      numerator: <SYS>_cluster_max_layer_frac_matched
      denominator: <SYS>_cluster_max_layer_frac
      label_x: <SYSU> cluster max layer hit fraction
      label_y: fraction of <SYSU> clusters LLP-matched
    sigbkg_<SYS>_cluster_layer_hits_relrms:
      type: sig_vs_bkg
      signal: <SYS>_cluster_layer_hits_relrms_matched
      background: <SYS>_cluster_layer_hits_relrms
      label_x: <SYSU> cluster RMS/mean of $N_{\mathrm{hits}}/\mathrm{layer}$
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_max_layer_frac:
      type: sig_vs_bkg
      signal: <SYS>_cluster_max_layer_frac_matched
      background: <SYS>_cluster_max_layer_frac
      label_x: <SYSU> cluster max layer hit fraction
      label_y: normalized clusters
- over: csc_dt
  defs:
    eff_<SYS>_vs_decay_rz:
      type: efficiency
      numerator: llp_rz_num_<SYS>
      denominator: llp_rz_den_<SYS>
      label_x: LLP decay $|z|$ [cm]
      label_y: LLP decay $r$ [cm]
      label_z: <SYSU> cluster efficiency (decay in <SYSU>)
    eff_<SYS>_fid_vs_decay_rz:
      type: efficiency
      numerator: llp_rz_den_<SYS>
      denominator: llp_rz_all_den
      label_x: LLP decay $|z|$ [cm]
      label_y: LLP decay $r$ [cm]
      label_z: 'Fiducial: decay in <SYSU> / all LLPs'
    eff_<SYS>_hits_vs_decay_rz:
      type: efficiency
      numerator: llp_rz_hits_<SYS>
      denominator: llp_rz_den_<SYS>
      label_x: LLP decay $|z|$ [cm]
      label_y: LLP decay $r$ [cm]
      label_z: 'Reconstructable: $\geq$10 <SYSU> hits / fiducial'
    eff_<SYS>_vs_decay_rz_all:
      type: efficiency
      numerator: llp_rz_all_num_<SYS>
      denominator: llp_rz_all_den
      label_x: LLP decay $|z|$ [cm]
      label_y: LLP decay $r$ [cm]
      label_z: <SYSU> acc. $\times$ eff. (all LLPs)
    eff_<SYS>_fid_vs_pt:
      type: efficiency
      numerator: llp_pt_den_<SYS>
      denominator: llp_pt_all_den
      label_x: LLP $p_T$ [GeV]
      label_y: 'Fiducial: decay in <SYSU> / all LLPs'
    eff_<SYS>_hits_vs_pt:
      type: efficiency
      numerator: llp_pt_hits_<SYS>
      denominator: llp_pt_den_<SYS>
      label_x: LLP $p_T$ [GeV]
      label_y: 'Reconstructable: $\geq$10 <SYSU> hits / fiducial'
    eff_<SYS>_reco_vs_pt:
      type: efficiency
      numerator: llp_pt_num_<SYS>
      denominator: llp_pt_hits_<SYS>
      label_x: LLP $p_T$ [GeV]
      label_y: 'Reconstructed: matched cluster / reconstructable'
    eff_<SYS>_fid_vs_eta:
      type: efficiency
      numerator: llp_eta_den_<SYS>
      denominator: llp_eta_all_den
      label_x: LLP $\eta$
      label_y: 'Fiducial: decay in <SYSU> / all LLPs'
    eff_<SYS>_hits_vs_eta:
      type: efficiency
      numerator: llp_eta_hits_<SYS>
      denominator: llp_eta_den_<SYS>
      label_x: LLP $\eta$
      label_y: 'Reconstructable: $\geq$10 <SYSU> hits / fiducial'
    eff_<SYS>_reco_vs_eta:
      type: efficiency
      numerator: llp_eta_num_<SYS>
      denominator: llp_eta_hits_<SYS>
      label_x: LLP $\eta$
      label_y: 'Reconstructed: matched cluster / reconstructable'
    matchfrac_<SYS>_avg_station:
      type: efficiency
      numerator: <SYS>_cluster_avg_station_matched
      denominator: <SYS>_cluster_avg_station
      label_x: <SYSU> cluster $\langle$station$\rangle$
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_r_spread:
      type: efficiency
      numerator: <SYS>_cluster_r_spread_matched
      denominator: <SYS>_cluster_r_spread
      label_x: <SYSU> cluster $r$ spread [cm]
      label_y: fraction of <SYSU> clusters LLP-matched
    matchfrac_<SYS>_z_spread:
      type: efficiency
      numerator: <SYS>_cluster_z_spread_matched
      denominator: <SYS>_cluster_z_spread
      label_x: <SYSU> cluster $z$ spread [cm]
      label_y: fraction of <SYSU> clusters LLP-matched
    sigbkg_<SYS>_cluster_avg_station:
      type: sig_vs_bkg
      signal: <SYS>_cluster_avg_station_matched
      background: <SYS>_cluster_avg_station
      label_x: <SYSU> cluster $\langle$station$\rangle$
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_r_spread:
      type: sig_vs_bkg
      signal: <SYS>_cluster_r_spread_matched
      background: <SYS>_cluster_r_spread
      label_x: <SYSU> cluster $r$ spread [cm]
      label_y: normalized clusters
    sigbkg_<SYS>_cluster_z_spread:
      type: sig_vs_bkg
      signal: <SYS>_cluster_z_spread_matched
      background: <SYS>_cluster_z_spread
      label_x: <SYSU> cluster $z$ spread [cm]
      label_y: normalized clusters
eff_csc_vs_nhits:
  type: efficiency
  numerator: llpcsc_nhits_csc_num
  denominator: llpcsc_nhits_csc_den
  label_x: $N_{\mathrm{CSC\ rechits}}$ from LLP in CSC
  label_y: CSC cluster efficiency (decay in CSC)
eff_dt_vs_nhits:
  type: efficiency
  numerator: llpdt_nhits_dt_num
  denominator: llpdt_nhits_dt_den
  label_x: $N_{\mathrm{DT\ rechits}}$ from LLP in DT
  label_y: DT cluster efficiency (decay in DT)
eff_any_vs_pt:
  type: efficiency
  numerator: llp_pt_num_any
  denominator: llp_pt_den_any
  label_x: LLP $p_T$ [GeV]
  label_y: MDS efficiency (decay in muon system)
eff_any_vs_eta:
  type: efficiency
  numerator: llp_eta_num_any
  denominator: llp_eta_den_any
  label_x: LLP $\eta$
  label_y: MDS efficiency (decay in muon system)
eff_csc_vs_energy:
  type: efficiency
  numerator: llp_energy_num_csc
  denominator: llp_energy_den_csc
  label_x: LLP energy [GeV]
  label_y: CSC cluster efficiency (decay in CSC)
eff_dt_vs_energy:
  type: efficiency
  numerator: llp_energy_num_dt
  denominator: llp_energy_den_dt
  label_x: LLP energy [GeV]
  label_y: DT cluster efficiency (decay in DT)
eff_any_vs_energy:
  type: efficiency
  numerator: llp_energy_num_any
  denominator: llp_energy_den_any
  label_x: LLP energy [GeV]
  label_y: MDS efficiency (decay in muon system)
# The intermediate step: does the LLP deposit enough rechits to be clustered
# at all?  Splitting it off separates "too few hits" from "hits, no cluster".
eff_csc_hits_vs_energy:
  type: efficiency
  numerator: llp_energy_hits_csc
  denominator: llp_energy_den_csc
  label_x: LLP energy [GeV]
  label_y: '$\geq$ 10 CSC rechits (decay in CSC)'
eff_dt_hits_vs_energy:
  type: efficiency
  numerator: llp_energy_hits_dt
  denominator: llp_energy_den_dt
  label_x: LLP energy [GeV]
  label_y: '$\geq$ 10 DT rechits (decay in DT)'
eff_dt_vs_decayr:
  type: efficiency
  numerator: llp_decayr_num_dt
  denominator: llp_decayr_den_dt
  label_x: LLP decay $r$ [cm]
  label_y: DT cluster efficiency (decay in DT)
  spans: &id001
  - lo: 418
    hi: 465
    label: MB1
  - lo: 499
    hi: 544
    label: MB2
  - lo: 606
    hi: 653
    label: MB3
  - lo: 708
    hi: 792
    label: MB4
eff_csc_vs_absdecayz:
  type: efficiency
  numerator: llp_absdecayz_num_csc
  denominator: llp_absdecayz_den_csc
  label_x: LLP decay $|z|$ [cm]
  label_y: CSC cluster efficiency (decay in CSC)
  spans: &id002
  - lo: 582
    hi: 623
    label: ME1/1
  - lo: 678
    hi: 719
    label: ME1/2,3
  - lo: 810
    hi: 847
    label: ME2
  - lo: 917
    hi: 954
    label: ME3
  - lo: 1006
    hi: 1044
