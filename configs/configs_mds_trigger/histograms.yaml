# ── Trigger-efficiency histograms ─────────────────────────────────
# All are event-level.  Numerator/denominator pairs share identical
# binning (required by derived_plots.yaml type: efficiency).
#
# Variables:
#   max CSC DBSCAN cluster size in the event (0 when no cluster)
#   total number of gen-matched CSC rechits in the event, counted
#   directly on the rechits (llpIdx >= 0) — never sum llp.nHitsCSC,
#   that can double count
#   PFMET pt (the METNoMu trigger variable minus muon correction; ggH
#   SUEP has essentially no prompt muons so PFMET ~ PFMETNoMu)
# Rechit-count axes use a constant 10-hit bin width.

# ── HLT_CscCluster_Loose vs largest CSC cluster size ──────────────

regions:
  csc:
    label: CSC clusters
    per_event:
      - evt_max_csc_cluster_size
      - evt_second_csc_cluster_size
  hlt_csccluster_loose:
    events: [hlt_csccluster_loose]
    per_event:
      - evt_max_csc_cluster_size
      - evt_n_csc_rechits_matched
  dt:
    label: DT clusters
    per_event:
      - evt_max_dt_cluster_size
  hlt_l1cscshower_dt50:
    events: [hlt_l1cscshower_dt50]
    per_event:
      - evt_max_dt_cluster_size
  hlt_l1cscshower_dt75:
    events: [hlt_l1cscshower_dt75]
    per_event:
      - evt_max_dt_cluster_size
  hlt_l1met_dt50:
    events: [hlt_l1met_dt50]
    per_event:
      - evt_max_dt_cluster_size
      - pf_met
      - {name: evt_met_vs_hltdtsize_num_l1met50, x: {var: pf_met, edges: [0, 25, 50, 75, 100, 125, 150, 175, 200, 250, 300, 400, 500]}, y: evt_max_hlt_dt_cluster_size}
  hlt_l1met_dtnomb1s50:
    events: [hlt_l1met_dtnomb1s50]
    per_event:
      - evt_max_dt_cluster_size
      - pf_met
  event:
    label: events
    per_event:
      - pf_met
      - {name: evt_met_vs_hltdtsize_den, x: {var: pf_met, edges: [0, 25, 50, 75, 100, 125, 150, 175, 200, 250, 300, 400, 500]}, y: evt_max_hlt_dt_cluster_size}
  has_hlt_dtcluster:
    events: [has_hlt_dtcluster]
    per_event:
      - pf_met
  hlt_pfmetnomu120:
    events: [hlt_pfmetnomu120]
    per_event:
      - pf_met
  has_hlt_dtcluster_hlt_l1met_dt50:
    events: [has_hlt_dtcluster, hlt_l1met_dt50]
    per_event:
      - pf_met
  csc_rechit:
    label: CSC rechits
    per_event:
      - evt_n_csc_rechits_matched
  hlt_doublecsc100:
    events: [hlt_doublecsc100]
    per_event:
      - evt_second_csc_cluster_size
  hlt_doublecsc75:
    events: [hlt_doublecsc75]
    per_event:
      - evt_second_csc_cluster_size
