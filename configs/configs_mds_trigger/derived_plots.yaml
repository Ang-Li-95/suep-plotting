# ── Trigger efficiencies (Clopper-Pearson at plot time) ───────────
# NOTE: do not pass --lumi (xs is a placeholder; scaling would distort
# the binomial intervals).

eff_hlt_csccluster_vs_maxsize:
  type: efficiency
  numerator: evt_maxcscsize_num
  denominator: evt_maxcscsize_den
  label_x: 'largest CSC cluster $N_{\mathrm{hits}}$'
  label_y: 'HLT_CscCluster_Loose efficiency'

eff_hlt_csccluster_vs_ngenhits:
  type: efficiency
  numerator: evt_ngenhits_csc_num
  denominator: evt_ngenhits_csc_den
  label_x: '$N_{\mathrm{CSC\ rechits}}$ gen-matched to LLPs'
  label_y: 'HLT_CscCluster_Loose efficiency'

eff_hlt_metnomu120_vs_met:
