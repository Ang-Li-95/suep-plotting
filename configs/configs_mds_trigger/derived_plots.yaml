# ── Trigger efficiencies (Clopper-Pearson at plot time) ───────────
# NOTE: do not pass --lumi (xs is a placeholder; scaling would distort
# the binomial intervals).

eff2d_hlt_l1met_dt50_met_vs_hltdtsize:
  label_x: PF $p_T^{\mathrm{miss}}$ [GeV]
  label_y: largest HLT DT cluster $N_{\mathrm{hits}}$
  label_z: HLT_L1MET_DTCluster50 efficiency
  type: efficiency
  numerator: hlt_l1met_dt50/evt_met_vs_hltdtsize_num_l1met50
  denominator: event/evt_met_vs_hltdtsize_den
eff_hlt_csccluster_vs_maxsize:
  label_x: largest CSC cluster $N_{\mathrm{hits}}$
  label_y: HLT_CscCluster_Loose efficiency
  type: efficiency
  numerator: hlt_csccluster_loose/evt_max_csc_cluster_size
  denominator: csc/evt_max_csc_cluster_size
eff_hlt_csccluster_vs_ngenhits:
  label_x: $N_{\mathrm{CSC\ rechits}}$ gen-matched to LLPs
  label_y: HLT_CscCluster_Loose efficiency
  type: efficiency
  numerator: hlt_csccluster_loose/evt_n_csc_rechits_matched
  denominator: csc_rechit/evt_n_csc_rechits_matched
eff_hlt_doublecsc100_vs_subsize:
  label_x: 2nd-largest CSC cluster $N_{\mathrm{hits}}$
  label_y: HLT_DoubleCscCluster100 efficiency
  type: efficiency
  numerator: hlt_doublecsc100/evt_second_csc_cluster_size
  denominator: csc/evt_second_csc_cluster_size
eff_hlt_doublecsc75_vs_subsize:
  label_x: 2nd-largest CSC cluster $N_{\mathrm{hits}}$
  label_y: HLT_DoubleCscCluster75 efficiency
  type: efficiency
  numerator: hlt_doublecsc75/evt_second_csc_cluster_size
  denominator: csc/evt_second_csc_cluster_size
eff_hlt_l1cscshower_dt50_vs_maxdtsize:
  label_x: largest DT cluster $N_{\mathrm{hits}}$
  label_y: HLT_L1CSCShower_DTCluster50 efficiency
  type: efficiency
  numerator: hlt_l1cscshower_dt50/evt_max_dt_cluster_size
  denominator: dt/evt_max_dt_cluster_size
eff_hlt_l1cscshower_dt75_vs_maxdtsize:
  label_x: largest DT cluster $N_{\mathrm{hits}}$
  label_y: HLT_L1CSCShower_DTCluster75 efficiency
  type: efficiency
  numerator: hlt_l1cscshower_dt75/evt_max_dt_cluster_size
  denominator: dt/evt_max_dt_cluster_size
eff_hlt_l1met_dt50_vs_maxdtsize:
