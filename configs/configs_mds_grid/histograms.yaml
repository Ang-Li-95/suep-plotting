# ── (8) Cluster isolation from prompt muons / jets ────────────────
# events.<sys>Cluster.drMuon / .drJet: dR from the cluster centroid to the
# closest reconstructed Muon / Jet (custom/columns.py).  Inclusive histograms
# are repeated here so the matched/unmatched splits get their matchfrac_* and
# sigbkg_* partners; the same inclusive plots also live in configs_mds/.
#
# Events with no muon (no jet) carry the sentinel NO_OBJECT_DR = 999, which
# overflows the axis and is folded into the last bin ('flow: sum', the
# default), so that bin counts the clusters with no prompt object to be
# measured against, on top of the few genuine entries above the axis maximum.

csc_cluster_dr_muon:
  expression: "events.cscCluster.drMuon"
  per_object: true
  bins: 60
  lo: 0
  hi: 6
  label: 'CSC cluster $\Delta R$(closest muon)'
  log_y: true
  variants: csc_variants

csc_cluster_dr_jet:
  expression: "events.cscCluster.drJet"
  per_object: true
  bins: 60
  lo: 0
  hi: 6
  label: 'CSC cluster $\Delta R$(closest jet)'
  log_y: true
  variants: csc_variants

