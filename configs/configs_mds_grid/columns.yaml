# custom/columns.py settings for this config set (see that module's docstring
# and the README's "Derived-column settings" section).
#
# Pinned to the same values as configs_mds/columns.yaml, not left to the module
# defaults: this set and configs_mds_data/ are overlaid against each other, so
# the clustering and the isolation-object definitions have to be identical by
# construction rather than by both happening to inherit today's defaults.
parameters:
  cluster_eps: 0.4
  cluster_min_samples: 10
  rpc_min_samples: 10
  match_min_hits: 10
  llpidx_convention: genpart
  # Which prompt objects the cluster drMuon / drJet are measured against.
  jerc: true                 # JEC on events.Jet first (data too); JER smearing on MC
  iso_jet_pt: 30.0
  iso_jet_abseta: 2.4
  iso_jet_id: tight          # official jetid.json.gz AK4PUPPI_Tight
  iso_muon_pt: 10.0
  iso_muon_abseta: 2.4
  iso_muon_id: loose         # Muon_looseId

# Everything: this is the truth superset of the study.
steps: [jerc, clusters, cluster_isolation, llp, llp_hits, llp_reco, llp_shape]
