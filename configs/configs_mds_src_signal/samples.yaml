# ── Category 1/6: clusters gen-matched to an LLP ──────────────────
# The reference signal point of the Gen3 grid.  Named after the *population*
# rather than the dataset, because the legend of the six-way comparison is a
# list of cluster sources -- and because the five background sets name theirs
# the same way (two of them are the same DY dataset under two cuts, which only
# works with distinct config names).
#
# All six points of the Gen3 grid (mDark 2, 5, 12 x T 1, 2; all ctau=5 m).
# They follow the registry's convention: colour encodes mDark, linestyle
# encodes T, so each mDark pair shows how much of the cluster shape is a
# property of the signal model rather than of the shower.  Add another point
# the same way (any suep_mDark<M>_temp<T> of ../../datasets.yaml).
_registry: ../../datasets.yaml

clusters_llp:
  _from: suep_mDark2_temp1
  label: 'LLP clusters (gen-matched), $m_{S}$=2, $T$=1'
  color: '#5790fc'
  linestyle: '-'
  group: signal
clusters_llp_temp2:
  _from: suep_mDark2_temp2
  label: 'LLP clusters (gen-matched), $m_{S}$=2, $T$=2'
  color: '#5790fc'
  linestyle: '--'
  group: signal
clusters_llp_mdark5_temp1:
  _from: suep_mDark5_temp1
  label: 'LLP clusters (gen-matched), $m_{S}$=5, $T$=1'
  color: '#e42536'
  linestyle: '-'
  group: signal
clusters_llp_mdark5_temp2:
  _from: suep_mDark5_temp2
  label: 'LLP clusters (gen-matched), $m_{S}$=5, $T$=2'
  color: '#e42536'
  linestyle: '--'
  group: signal
clusters_llp_mdark12_temp1:
  _from: suep_mDark12_temp1
  label: 'LLP clusters (gen-matched), $m_{S}$=12, $T$=1'
  color: '#964a8b'
  linestyle: '-'
  group: signal
clusters_llp_mdark12_temp2:
  _from: suep_mDark12_temp2
  label: 'LLP clusters (gen-matched), $m_{S}$=12, $T$=2'
  color: '#964a8b'
  linestyle: '--'
  group: signal
