# ── Category 1/6: clusters gen-matched to an LLP ──────────────────
# The only set of the six that needs gen information: its src cut is the
# clusters' truth match (cluster.matched), so its derive() runs the truth
# steps too.  The clustering parameters are the same as in every other
# configs_mds_src_* set, so the populations stay comparable bin for bin.

# ── derive() settings: the same clustering in every MDS set ───────
# The clustering and jet calibration every set is compared against.  Pinned
# rather than left to the module defaults: the studies are overlaid, so a
# future change to custom/params.py must not move one of them silently --
# and since every set now spells them out, keep them identical across sets.
#
# The truth steps (llp, llp_hits, llp_reco, llp_shape) run only in sets with
# gen-level fills: a set without them should not pay for them, and
# events.llp being absent is what makes a stray gen expression fail at
# validation instead of filling empty.
parameters:
  cluster_eps: 0.4
  cluster_min_samples: 10
  match_min_hits: 10
  jerc: true  # JEC on events.Jet (data too); JER smearing on MC
  # The RPC rechits are associated to the finished CSC and DT clusters rather
  # than clustered on their own: they can then date a cluster without being
  # able to create one, so the cluster variables and the signal region stay
  # those of the standard MDS analysis.  This is why there is no
  # events.rpcCluster and no rpc_cluster_* histogram anywhere below.
  # rpc_min_samples is unused in this mode.
  rpc_mode: match

steps: [jerc, jet_id, clusters, cluster_isolation, llp, llp_hits, llp_reco, llp_shape]
