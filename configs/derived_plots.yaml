# ── Derived plots ──────────────────────────────────────────────────
# These are computed at plot time from saved histograms — no
# reprocessing needed.
#
# Supported types:
#
#   profile_x   – mean of y per x-bin from a 2D histogram (TProfile)
#   profile_y   – mean of x per y-bin from a 2D histogram
#   projection_x – project 2D histogram onto x axis
#   projection_y – project 2D histogram onto y axis
#   efficiency  – ratio of two 1D histograms with binomial errors
#   ratio       – generic bin-by-bin ratio of two 1D histograms
#
# Fields:
#   type:         one of the types above
#   source:       name of a 2D histogram (for profile/projection types)
#   numerator:    name of a 1D histogram (for efficiency/ratio types)
#   denominator:  name of a 1D histogram (for efficiency/ratio types)
#   label_x:      override x-axis label
#   label_y:      override y-axis label

# ── Active examples ───────────────────────────────────────────────

jet_pt_vs_eta_profile:
  type: profile_x
  source: jet_pt_vs_eta
  label_y: "Mean $p_T^{\\mathrm{jet}}$ [GeV]"

csc_size_vs_eta_profile:
  type: profile_x
  source: csc_cluster_size_vs_eta
  label_y: "Mean CSC cluster size"

jet_eta_from_2d:
  type: projection_x
  source: jet_pt_vs_eta

jet_pt_from_2d:
  type: projection_y
  source: jet_pt_vs_eta

met_reco_vs_gen:
  type: ratio
  numerator: met_pt
  denominator: genmet_pt
  label_y: "Reco / Gen"

