# ── (3) DBSCAN cluster properties: RPC ─────────────────────────────
csc_cluster_nlayer:
  expression: "events.cscCluster.nLayer"
  per_object: true
  bins: 12
  lo: 0
  hi: 12
  label: 'CSC cluster $N_{\mathrm{layers}}$'

dt_cluster_nlayer:
  expression: "events.dtCluster.nLayer"
  per_object: true
