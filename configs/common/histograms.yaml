# ── Event-level: MET and jet multiplicities ───────────────────────
puppi_met:
  expression: "events.PuppiMET.pt"
  bins: 50
  lo: 0
  hi: 500
  label: 'PUPPI $p_T^{\mathrm{miss}}$ [GeV]'
  log_y: true

# The count comes from the same selections.yaml entry the cluster isolation
# uses (attached as an event column by the cluster_isolation step), so the cut
# is written once and retuning it moves the isolation and this plot together.
n_jet_sel_foriso:
  expression: "events.n_jet_sel_foriso"
  bins: 12
  lo: -0.5
  hi: 11.5
  label: '$N_{\mathrm{jets}}$ passing jet_sel_foriso'
  log_y: true

n_fatjet:
  expression: "ak.num(events.FatJet)"
  bins: 6
  lo: -0.5
  hi: 5.5
  label: '$N_{\mathrm{AK8\ jets}}$'
  log_y: true

# ── The two independent clocks on one cluster ─────────────────────
# The CSC Tpeak against the RPC bunch crossing of the same cluster: the only
# cross-check there is that the RPC hits a cluster picked up belong to it.
# They are different clocks, so this is a correlation, not a residual.
csc_cluster_time_vs_rpc_bx_time:
  expression_x: "events.cscCluster.time"
  expression_y: "events.cscCluster.rpcBx * 25"
  per_object: true
  selections:
  - csc_cluster_has_rpc
  bins_x: 60
  lo_x: -30
  hi_x: 90
  bins_y: 40
  lo_y: -100
  hi_y: 100
  label_x: 'CSC cluster mean $t_{\mathrm{peak}}$ [ns]'
  label_y: 'CSC cluster RPC time from BX [ns]'
  log_z: true
