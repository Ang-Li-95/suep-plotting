#
# Deliberately no `_variant_sets` and no `variants:` here: what a cluster is
# split by is the study's business, and configs_mds wants the inclusive fills
# on their own.

csc_cluster_n:
  expression: "ak.num(events.cscCluster)"
  bins: 6
  lo: 0
  hi: 6
  label: '$N_{\mathrm{CSC\ clusters}}$'
  log_y: true

csc_cluster_size:
  expression: "events.cscCluster.size"
  per_object: true
  bins: 50
  lo: 0
  hi: 500
  label: 'CSC cluster $N_{\mathrm{hits}}$'
  log_y: true

csc_cluster_eta:
  expression: "events.cscCluster.eta"
  per_object: true
  bins: 50
  lo: -3
  hi: 3
  label: 'CSC cluster $\eta$'

csc_cluster_phi:
  expression: "events.cscCluster.phi"
  per_object: true
  bins: 32
  lo: -3.2
  hi: 3.2
  label: 'CSC cluster $\phi$'

csc_cluster_eta_spread:
  expression: "events.cscCluster.etaSpread"
  per_object: true
  bins: 40
  lo: 0
  hi: 0.4
  label: 'CSC cluster $\eta$ spread'

csc_cluster_phi_spread:
  expression: "events.cscCluster.phiSpread"
  per_object: true
  bins: 40
  lo: 0
  hi: 0.4
  label: 'CSC cluster $\phi$ spread'

csc_cluster_nstation:
  expression: "events.cscCluster.nStation"
  per_object: true
  bins: 5
  lo: 0
  hi: 5
  label: 'CSC cluster $N_{\mathrm{stations}}$'

csc_cluster_time:
  expression: "events.cscCluster.time"
  per_object: true
  bins: 60
  lo: -30
  hi: 90
  label: 'CSC cluster mean $t_{\mathrm{peak}}$ [ns]'
  log_y: true

