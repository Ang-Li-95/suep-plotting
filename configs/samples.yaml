# ── Sample definitions ─────────────────────────────────────────────
# Each top-level key is a sample name used throughout the framework.
# Fields:
#   files:      list of file paths / glob patterns / xrootd URLs
#   xs:         cross section in pb  (MC only; used to scale by xs*lumi*1000/sumw
#               when --lumi is passed at plot time)
#   is_data:    true for data samples
#   label:      display label for legends
#   color:      matplotlib color
#   tree:       TTree name (default: Events)
#   group:      signal / background / (data via is_data) for plot styling
#   scale:      plot-time multiplier for signal overlays (legend shows "x N");
#               ignored when --normalize is used

suep_mMed125_mDark2:
  files:
    - "/users/ang.li/public/SUEP/Generation/MDSNano/CMSSW_15_0_2/src/MDSNANO/EXO-RunIII2024Summer24NanoAODv15-00307.root"
  tree: Events
  is_data: false
  xs: 1.0         # placeholder – set to real value
  label: "SUEP $m_{\\mathrm{Med}}$=125, $m_{\\mathrm{Dark}}$=2"
  color: "tab:blue"
  group: signal

