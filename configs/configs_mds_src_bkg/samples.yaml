# ── SM backgrounds: QCD, W+jets, Z->nunu, ttbar ───────────────────
# 22 datasets with real cross sections (../../datasets.yaml), so these runs
# are plotted with --lumi, which also sums the HT / jet bins of a process into
# one stack entry (their `process:` in the registry).
#
# max_files: the first 1,000 files of each dataset, as in the DY sets.  The
# xs/sumw weight uses the sumw of the files actually processed, so a partial
# dataset is normalized correctly.
