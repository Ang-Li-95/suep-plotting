# ── Corrections via coffea tooling ─────────────────────────────────
# Scale factors are wrapped with coffea's correctionlib_wrapper and combined
# with coffea.analysis_tools.Weights.  All entries are optional; an empty file
# means "no corrections".
#
# Fields:
#   file:        path to the correctionlib JSON (.json.gz), or
#                "auto:<POG>/<year>/<tag>" to resolve from $CORRECTIONLIB_DATA
#                or the cvmfs jsonpog-integration path.
#   name:        correction name inside the JSON file.
#   inputs:      list of expressions passed to the evaluator, IN THE ORDER the
#                correction declares its inputs.  Use NanoEvents syntax, e.g.
#                events.Pileup.nTrueInt, abs(events.Muon.eta).  Bare string
#                literals like "'nominal'" select a systematic/category axis.
#   kind:        "event_weight" — one weight per event.
#                "object_sf"    — one SF per object; per-event weight is the
#                                 product over objects (jagged inputs are
#                                 flattened automatically; scalar inputs such as
#                                 the systematic string are passed through).
#   apply_to:    list of sample groups (or "all", default) this applies to.
#                Data samples are always skipped.

# Example: pileup reweighting
# pileup:
#   file: "auto:LUM/2024_Summer24/puWeights.json.gz"
#   name: "Collisions2024_goldenJSON"
#   inputs:
#     - "events.Pileup.nTrueInt"
#     - "'nominal'"
#   kind: event_weight
#   apply_to: all

# Example: muon ID scale factor (per-muon)
# muon_id_sf:
#   file: "auto:MUO/2024_Summer24/muon_Z.json.gz"
#   name: "NUM_MediumID_DEN_TrackerMuons"
#   inputs:
#     - "abs(events.Muon.eta)"
#     - "events.Muon.pt"
#     - "'nominal'"
#   kind: object_sf
#   apply_to: all
