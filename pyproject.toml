[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "suep-plot"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "coffea>=2024.0.0",
    "hist>=2.7",
    "mplhep>=0.3",
    "uproot>=5.0",
    "awkward>=2.0",
    "correctionlib>=2.3",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    # custom/: DBSCAN clustering and the numba kernels of the LLP collection
    "scikit-learn>=1.0",
    "numba>=0.57",
    # root:// inputs: directory listing (processor.py) and reading (uproot)
    "xrootd>=5.6",
    "fsspec-xrootd>=0.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
suep-run = "suep_plot.cli:run"
suep-plot = "suep_plot.cli:plot"
suep-submit = "suep_plot.cli:submit"
suep-status = "suep_plot.cli:status"
suep-reweight = "suep_plot.cli:reweight"

[tool.setuptools.packages.find]
where = ["src"]

# The JERSmear payload is shipped with the package: it is tiny and jsonpog does
# not distribute it per era, so jme.py reads it from next to the module.
[tool.setuptools.package-data]
suep_plot = ["*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The checkout itself: `custom` lives at the repo root, `suep_plot` under src/.
pythonpath = [".", "src"]
