csc_cluster_nmatchedhits: {expression: events.cscCluster.nMatchedHits, bins: [50, 0, 200], label: 'CSC cluster $N_{\mathrm{hits}}^{\mathrm{LLP-matched}}$', log_y: true}
csc_cluster_nmatchedllp: {expression: events.cscCluster.nMatchedLLP, bins: [6, 0, 6], label: 'CSC cluster $N_{\mathrm{LLP\ matched}}$', log_y: true}
