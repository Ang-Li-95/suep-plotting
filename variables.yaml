# ── CSC + DT clusters together ────────────────────────────────────────
mds_cluster_n: {expression: ak.num(events.cscCluster) + ak.num(events.dtCluster), bins: [11, -0.5, 10.5], label: '$N_{\mathrm{MDS\ clusters}}$ (CSC + DT)', log_y: true}
