csc_cluster_eta_spread: {expression: events.cscCluster.etaSpread, bins: [40, 0, 0.4], label: CSC cluster $\eta$ spread}
csc_cluster_first_chamber: {expression: events.cscCluster.firstChamber, bins: [50, -0.5, 49.5], label: CSC cluster first-hit chamber (ME station/ring)}
csc_cluster_first_station: {expression: events.cscCluster.firstStation, bins: [6, -0.5, 5.5], label: CSC cluster first-hit station}
csc_cluster_first_system: {expression: events.cscCluster.firstSystem, bins: [3, 0, 3], label: 'CSC cluster innermost hit system (0 CSC, 1 DT, 2 RPC)'}
