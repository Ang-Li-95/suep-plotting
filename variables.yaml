csc_cluster_time_spread: {expression: events.cscCluster.timeSpread, bins: [50, 0, 50], label: 'CSC cluster $t_{\mathrm{peak}}$ RMS [ns]', log_y: true}
csc_cluster_z_spread: {expression: events.cscCluster.zSpread, bins: [40, 0, 250], label: 'CSC cluster $z$ spread [cm]'}
