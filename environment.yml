# The conda environment suep-plotting runs in -- on CBE.next the shared one is
# called `rootmds`.  conda-forge only: never the Anaconda `defaults` channel
# (licence terms), so use Miniforge's conda.
#
#   conda env create -f environment.yml
#   conda activate rootmds
#   pip install -e .          # the package itself, editable, from the checkout
#
# Pinned to the versions the framework was last validated with (2026-11-09).
# Raise them deliberately, then rerun the tests and a parity check
# (docs/running.md).
name: rootmds
channels:
  - conda-forge
dependencies:
  - python=3.12
  - coffea=2026.9.0
  - uproot=5.7.7
  - awkward=2.14.0
  - hist=2.12.1
  - mplhep=1.3.3
  - matplotlib=3.11.2
  - numpy=2.5.4
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - numba=0.68.1
  - correctionlib=2.9.0
  - xrootd=6.2.1
  - fsspec-xrootd=0.5.5
  - pyyaml=6.0.3
  - pytest=9.2.0
  - pip
