# Central dataset registry.
#
# One definition per dataset; configs pull them in via
#
#   _include: ../datasets.yaml
#   suep_temp1:                 # verbatim
#   suep_temp2:                 # with overrides
#     color: "black"
#   dy:                         # same dataset under another config name
#     _from: dy_central_50to120
#
# 'files' may be a file, a glob, or a directory (walked recursively for *.root),
# local or xrootd.  Keep plot-only keys (label, color) here as defaults and
# override them per config where a study needs something different.
# Signal points to Gen3 (2026-08-05); Gen2 kept below for the G4 comparison.
#
# The Gen3 grid is ggH, mMed=125, ctau=5 m, scanned in (mDark, temperature):
# mDark = 2 / 5 / 12 GeV x T = 1 / 2.  The mDark=2 points keep their original
# names suep_temp1 / suep_temp2 (referenced by every existing config); the
# other four follow suep_mDark<M>_temp<T>.
suep_temp1:
  files:
  - root://eos.grid.vbc.ac.at//eos/vbc/experiments/cms/store/user/lian/SUEPs_Gen3/2024/run3_ggH-channel_mMed-125_mDark-2_portal-higgs_temp-1_decay-generic_ctau-5000p0_13TeV-pythia8/MDSNANO
  tree: Events
  is_data: false
  xs: 1.0
  label: SUEP $m_{\mathrm{Dark}}$=2, $T$=1, $c\tau$=5 m
  color: tab:blue
  linestyle: '-'
  group: signal
suep_temp2:
  files:
  - root://eos.grid.vbc.ac.at//eos/vbc/experiments/cms/store/user/lian/SUEPs_Gen3/2024/run3_ggH-channel_mMed-125_mDark-2_portal-higgs_temp-2_decay-generic_ctau-5000p0_13TeV-pythia8/MDSNANO
  tree: Events
  is_data: false
  xs: 1.0
  label: SUEP $m_{\mathrm{Dark}}$=2, $T$=2, $c\tau$=5 m
  color: tab:blue
  linestyle: '--'
  group: signal
# Remaining Gen3 grid points (mDark = 5, 12).  Same production, same 25-file
