# Central dataset registry.
#
# One definition per dataset; a config set's samples.yaml selects from it with
#
#   _registry: ../../datasets.yaml
#   suep_mDark2_temp1:          # verbatim
#   suep_mDark2_temp2:          # with overrides
#     color: "black"
#   dy:                         # same dataset under another config name
#     _from: dy_central_50to120
#
# 'files' may be a file, a glob, or a directory (walked recursively for *.root),
# local or xrootd.  Keep plot-only keys (label, color) here as defaults and
# override them per config where a study needs something different.
# files_per_job (optional) is the shard size suep-submit uses for a dataset
# when --files-per-job is not given.
# Signal points to Gen3 (2026-08-05); Gen2 kept below for the G4 comparison.
#
# The Gen3 grid is ggH, mMed=125, ctau=5 m, scanned in (mDark, temperature):
# mDark = 2 / 5 / 12 GeV x T = 1 / 2, all named suep_mDark<M>_temp<T>.
# The mDark=2 points were called suep_temp1 / suep_temp2 until 2026-08-13, and
# are the same datasets under the new names; every config set was repointed on
# 2026-08-25, so the old names appear only in studies/ (which reads its own
# frozen pickles).
suep_mDark2_temp1:
  files:
  - root://eos.grid.vbc.ac.at//eos/vbc/experiments/cms/store/user/lian/SUEPs_Gen3/2024/run3_ggH-channel_mMed-125_mDark-2_portal-higgs_temp-1_decay-generic_ctau-5000p0_13TeV-pythia8/MDSNANO
  tree: Events
  is_data: false
  xs: 1.0
  label: SUEP $m_{S}$=2, $T$=1, $c\tau$=5 m
  color: tab:blue
  linestyle: '-'
  marker: o
  group: signal
suep_mDark2_temp2:
  files:
  - root://eos.grid.vbc.ac.at//eos/vbc/experiments/cms/store/user/lian/SUEPs_Gen3/2024/run3_ggH-channel_mMed-125_mDark-2_portal-higgs_temp-2_decay-generic_ctau-5000p0_13TeV-pythia8/MDSNANO
  tree: Events
  is_data: false
  xs: 1.0
  label: SUEP $m_{S}$=2, $T$=2, $c\tau$=5 m
  color: tab:blue
  linestyle: '--'
  marker: s
  group: signal
