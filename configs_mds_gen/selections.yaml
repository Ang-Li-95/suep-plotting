# ── Selections for the gen-level LLP / rechit study ───────────────
# Truth-only masks on events.llp and the rechit collections; no cluster
# (reco) selections, so this config runs with MDS_SKIP_CLUSTERING=1.

# LLP decay volume flags (geometry defined in custom/columns.py)
llp_in_csc:
  level: object
  expression: "events.llp.inCSC"
llp_in_dt:
  level: object
  expression: "events.llp.inDT"
llp_in_rpc:
  level: object
  expression: "events.llp.inRPC"
llp_in_ms:
  level: object
  expression: "events.llp.inCSC | events.llp.inDT | events.llp.inRPC"

# LLP is "reconstructable": >= 10 of its truth rechits in the system
llp_hits10_csc:
  level: object
  expression: "events.llp.nHitsCSC >= 10"
llp_hits10_dt:
  level: object
  expression: "events.llp.nHitsDT >= 10"
llp_hits10_total:
  level: object
  expression: "events.llp.nHitsTotal >= 10"

# LLP with >= 2 truth rechits: the minimum for a rechit-rechit dR to exist
# (the per-LLP dR fields are NaN below it and drop out of the fill anyway)
llp_hits2_csc:
  level: object
  expression: "events.llp.nHitsCSC >= 2"
llp_hits2_dt:
  level: object
  expression: "events.llp.nHitsDT >= 2"
llp_hits2_rpc:
  level: object
  expression: "events.llp.nHitsRPC >= 2"
llp_hits2_total:
  level: object
  expression: "events.llp.nHitsTotal >= 2"

# Rechit truth-matched to an LLP (always False on truth-less background)
csc_rechit_matched:
  level: object
  expression: "events.cscRechits.matchedLLP"
dt_rechit_matched:
  level: object
  expression: "events.dtRecHits.matchedLLP"
rpc_rechit_matched:
  level: object
  expression: "events.rpcRecHits.matchedLLP"

# Event-level bookkeeping (cutflow.txt)
has_llp_in_ms:
  expression: "ak.any(events.llp.inCSC | events.llp.inDT | events.llp.inRPC, axis=1)"
has_llp_hits_csc:
  expression: "ak.any(events.llp.nHitsCSC >= 10, axis=1)"
has_llp_hits_dt:
  expression: "ak.any(events.llp.nHitsDT >= 10, axis=1)"
