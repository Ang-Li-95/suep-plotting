# ── Gen-level LLP / matched-rechit histograms ─────────────────────
# Truth only: the LLPs of SUEPGenPart (pdgId 999999) and the rechits
# carrying their llpIdx.  No DBSCAN clusters, no trigger, no efficiencies
# — see configs_mds/ for the full reconstruction study.
#
# Everything comes from the derived collections in custom/columns.py:
#   events.llp                              one entry per generated LLP
#   events.<sys>Rechits.{matchedLLP,drLLP}  per-rechit truth match + dR
#
# Because nothing here touches events.<sys>Cluster, this config can run
# with MDS_SKIP_CLUSTERING=1, which drops the DBSCAN step (~35% of the
# processing time).

# ── (1) LLP multiplicity ──────────────────────────────────────────
llp_n:
  expression: "ak.num(events.llp)"
  bins: 60
  lo: 0
  hi: 60
  label: '$N_{\mathrm{LLP}}$'

# ── (2) LLPs decaying in each muon system volume ──────────────────
llp_n_csc:
  expression: "ak.sum(events.llp.inCSC, axis=1)"
  bins: 15
  lo: 0
  hi: 15
  label: '$N_{\mathrm{LLP}}$ decaying in CSC'

llp_n_dt:
  expression: "ak.sum(events.llp.inDT, axis=1)"
  bins: 15
  lo: 0
  hi: 15
  label: '$N_{\mathrm{LLP}}$ decaying in DT'

llp_n_rpc:
  expression: "ak.sum(events.llp.inRPC, axis=1)"
  bins: 15
  lo: 0
  hi: 15
  label: '$N_{\mathrm{LLP}}$ decaying in RPC'

llp_decay_r:
  expression: "events.llp.decayR"
  per_object: true
  bins: 60
  lo: 0
  hi: 1200
  label: 'LLP decay $r$ [cm]'
  log_y: true

llp_decay_absz:
  expression: "abs(events.llp.decayZ)"
  per_object: true
  bins: 60
  lo: 0
  hi: 2000
  label: 'LLP decay $|z|$ [cm]'
  log_y: true

llp_decay_rz:
  expression_x: "abs(events.llp.decayZ)"
  expression_y: "events.llp.decayR"
  per_object: true
  bins_x: 60
  lo_x: 0
  hi_x: 1500
  bins_y: 60
  lo_y: 0
  hi_y: 900
  label_x: 'LLP decay $|z|$ [cm]'
  label_y: 'LLP decay $r$ [cm]'
  log_z: true

# ── (2b) LLP lifetime / boost ─────────────────────────────────────
# Proper decay length ctau = L_lab / (beta*gamma): exponential with mean
# = nominal sample lifetime (5 m = 500 cm here).
llp_ctau:
  expression: "events.llp.ctau"
  per_object: true
  bins: 60
  lo: 0
  hi: 3000
  label: 'LLP $c\tau$ (proper) [cm]'
  log_y: true

llp_llab:
  expression: "events.llp.Llab"
  per_object: true
  bins: 60
  lo: 0
  hi: 6000
  label: 'LLP lab decay length [cm]'
  log_y: true

llp_betagamma:
  expression: "events.llp.betagamma"
  per_object: true
  bins: 60
  lo: 0
  hi: 30
  label: 'LLP $\beta\gamma$'
  log_y: true

# ── (2c) LLP kinematics ───────────────────────────────────────────
llp_pt:
  expression: "events.llp.pt"
  per_object: true
  bins: 50
  lo: 0
  hi: 50
  label: 'LLP $p_T$ [GeV]'
  log_y: true

llp_abseta:
  expression: "abs(events.llp.eta)"
  per_object: true
  bins: 30
  lo: 0
  hi: 3
  label: 'LLP $|\eta|$'

llp_energy:
  expression: "events.llp.energy"
  per_object: true
  bins: 50
  lo: 0
  hi: 100
  label: 'LLP energy [GeV]'
  log_y: true

# ── (4b) Per-LLP matched rechit counts ────────────────────────────
llpcsc_nhits_csc:
  expression: "events.llp.nHitsCSC"
  per_object: true
  selections: [llp_in_csc]
  bins: 100
  lo: 0
  hi: 200
  label: '$N_{\mathrm{CSC\ rechits}}$ from LLP in CSC'
  log_y: true

llpdt_nhits_dt:
  expression: "events.llp.nHitsDT"
  per_object: true
  selections: [llp_in_dt]
  bins: 100
  lo: 0
  hi: 200
  label: '$N_{\mathrm{DT\ rechits}}$ from LLP in DT'
  log_y: true

llp_nhits_csc:
  expression: "events.llp.nHitsCSC"
  per_object: true
  bins: 100
  lo: 0
  hi: 200
  label: '$N_{\mathrm{CSC\ rechits}}$ from LLP'
  log_y: true

llp_nhits_dt:
  expression: "events.llp.nHitsDT"
  per_object: true
  bins: 100
  lo: 0
  hi: 200
  label: '$N_{\mathrm{DT\ rechits}}$ from LLP'
  log_y: true

llp_nhits_rpc:
  expression: "events.llp.nHitsRPC"
  per_object: true
  bins: 60
  lo: 0
  hi: 60
  label: '$N_{\mathrm{RPC\ rechits}}$ from LLP'
  log_y: true

llp_nhits_total:
  expression: "events.llp.nHitsTotal"
  per_object: true
  bins: 100
  lo: 0
  hi: 300
  label: '$N_{\mathrm{muon\ rechits}}$ from LLP (CSC+DT+RPC)'
  log_y: true

# ── (4c) Per-LLP spread of the matched rechits ────────────────────
# Gen-level answer to "how wide is the rechit shower of one LLP":
#   drpair_min/max  extreme dR between any two of the LLP's rechits
#   dr50/80/90/max  radius around the rechit centroid holding that
#                   percentage of them (cone size to collect them)
# Filled per LLP with >= 2 matched rechits in the system (below that no
# dR is defined); the _hits10 variants use the >= 10 rechits that a DBSCAN
# cluster needs to be truth-matched.  Overflow is folded into the last bin.

llp_drpair_min_csc:
  expression: "events.llp.drPairMinCSC"
  per_object: true
  selections: [llp_hits2_csc]
  edges: [0.0001, 0.00013335, 0.00017783, 0.00023714, 0.00031623, 0.0004217, 0.00056234, 0.00074989, 0.001, 0.0013335, 0.0017783, 0.0023714, 0.0031623, 0.004217, 0.0056234, 0.0074989, 0.01, 0.013335, 0.017783, 0.023714, 0.031623, 0.04217, 0.056234, 0.074989, 0.1, 0.13335, 0.17783, 0.23714, 0.31623, 0.4217, 0.56234, 0.74989, 1]
  label: 'LLP CSC rechits: min pairwise $\Delta R$'
  log_x: true
  log_y: true
  flow: sum

llp_drpair_max_csc:
  expression: "events.llp.drPairMaxCSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins: 60
  lo: 0
  hi: 1.5
  label: 'LLP CSC rechits: max pairwise $\Delta R$'
  log_y: true
  flow: sum

llp_dr50_csc:
  expression: "events.llp.dr50CSC"
  per_object: true
  selections: [llp_hits2_csc]
  bins: 60
  lo: 0
  hi: 0.6
  label: 'LLP CSC rechits: $\Delta R$ containing 50% of rechits'
  flow: sum

llp_dr80_csc:
